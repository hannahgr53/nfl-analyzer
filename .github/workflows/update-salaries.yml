name: Update salaries

# Salaries move all week: DraftKings posts a slate days out and revises it, and
# late injury news reprices players. Four runs cover it — Wednesday, Friday,
# Saturday, and Sunday morning before the early window.
# workflow_dispatch means you can also run it by hand from the Actions tab.
on:
  schedule:
    - cron: "0 15 * * 3"
    - cron: "0 15 * * 5"
    - cron: "0 15 * * 6"
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/salaries.json
        # No secrets needed. Both books come from public endpoints.
        # FD_SLATE_ID can pin one FanDuel slate if the slate lookup ever breaks.
        run: python scripts/build_salaries.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain data/salaries.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/salaries.json
            git commit -m "Salary refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing to commit"
          fi
