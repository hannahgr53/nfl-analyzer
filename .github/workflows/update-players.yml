name: Update players

# Tuesday mornings, alongside the EPA refresh — nflverse posts the completed
# week by then. This is what replaces the hand-generated snapshot's fantasy
# numbers, so the app stops aging out between snapshots.
on:
  schedule:
    - cron: "30 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/players.json
        run: python scripts/build_players.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain data/players.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/players.json
            git commit -m "Player scoring refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing to commit"
          fi
