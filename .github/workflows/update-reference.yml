name: Update reference tables

# Tuesday mornings, after nflverse has added the completed week. This is what
# replaces the hand-run generator: records, ratings, run and pass game, first
# drives, coaching tendencies, team defense and fantasy scoring.
on:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/reference.json
        run: python scripts/build_reference.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain data/reference.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/reference.json
            git commit -m "Reference tables refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing to commit"
          fi
