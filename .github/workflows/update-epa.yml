name: Update EPA

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/epa.json
        run: python scripts/build_epa.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain data/epa.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/epa.json
            git commit -m "EPA refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing to commit"
          fi
