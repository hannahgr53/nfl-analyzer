rm:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Min projected — {{ minPtsLabel }}<\u002Fdiv>\n            <input type=\"range\" min=\"0\" max=\"26\" step=\"1\" value=\"{{ minPts }}\" sc-camel-on-change=\"{{ onMinPts }}\" style=\"width:170px\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Filters<\u002Fdiv>\n            <div style=\"display:flex;gap:4px\">\n              <div sc-camel-on-click=\"{{ toggleDiv }}\" style=\"{{ divStyle }}\">Division<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ toggleHealthy }}\" style=\"{{ healthyStyle }}\">Healthy only<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:auto;max-height:70vh\">\n          <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:12.5px\">\n            <sc-raw-thead><sc-raw-tr>\n              <sc-for list=\"{{ fpHeaders }}\" as=\"h\" hint-placeholder-count=\"13\">\n                <sc-raw-th sc-camel-on-click=\"{{ h.go }}\" style=\"{{ h.style }}\">{{ h.label }}<\u002Fsc-raw-th>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ fpRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;font-weight:600;white-space:nowrap\">{{ r.player }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;color:#6b746e\">{{ r.pos }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee\">{{ r.team }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;white-space:nowrap\">{{ r.opp }}<span style=\"{{ r.oppStyle }}\">{{ r.oppRank }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums\">{{ r.proj }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;color:#6b746e;font-variant-numeric:tabular-nums\">{{ r.floor }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;color:#6b746e;font-variant-numeric:tabular-nums\">{{ r.ceiling }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;font-variant-numeric:tabular-nums\"><span style=\"{{ r.boomStyle }}\">{{ r.boom }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;font-variant-numeric:tabular-nums\"><span style=\"{{ r.bustStyle }}\">{{ r.bust }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;font-variant-numeric:tabular-nums\">{{ r.l3 }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;white-space:nowrap\"><span style=\"{{ r.trendStyle }}\">{{ r.trend }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;font-variant-numeric:tabular-nums\">{{ r.snap }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;text-align:right;font-variant-numeric:tabular-nums\">{{ r.tgt }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <div style=\"padding:13px 16px;font-size:12px;color:#6b746e\">{{ fpEmpty }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#6b746e;margin-top:9px;line-height:1.6\">Floor and ceiling are the 10th and 90th percentile of {{ fpTrialsLabel }} simulated games per player. Boom is the chance of clearing a position-specific big-game line; bust is finishing under half the projection. Variance widens for players carrying an injury tag or a snap share under 55%.<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#6b746e;margin-top:6px;line-height:1.6;text-wrap:pretty\">{{ fpCorrNote }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#12201a;margin-top:8px;line-height:1.6;text-wrap:pretty;background:#fff;border-left:3px solid #d4a017;padding:9px 12px;border-radius:0 4px 4px 0\">{{ fpAdjNote }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#6b746e;margin-top:6px;line-height:1.6;text-wrap:pretty\">{{ fpBaseNote }}<\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:15px 17px;margin-top:14px\">\n          <div style=\"font-family:Georgia,serif;font-size:16px;margin-bottom:3px\">Projection accuracy<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:12px;text-wrap:pretty\">{{ accIntro }}<\u002Fdiv>\n\n          <sc-if value=\"{{ accHas }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"display:flex;gap:24px;flex-wrap:wrap;background:#f8f7f2;border-radius:5px;padding:11px 13px;margin-bottom:11px\">\n                <div>\n                  <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">Graded<\u002Fdiv>\n                  <div style=\"font-family:Georgia,serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">{{ accN }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">Awaiting games<\u002Fdiv>\n                  <div style=\"font-family:Georgia,serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">{{ accOpen }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">Avg miss<\u002Fdiv>\n                  <div style=\"font-family:Georgia,serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">{{ accMae }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">Bias<\u002Fdiv>\n                  <div style=\"font-family:Georgia,serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">{{ accBias }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <sc-for list=\"{{ accRows }}\" as=\"a\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:44px 46px 1fr 56px 58px;gap:8px;align-items:baseline;font-size:12px;border-top:1px solid #f1f2ee;padding-top:6px\">\n                    <span style=\"font-weight:700\">{{ a.pos }}<\u002Fspan>\n                    <span style=\"color:#6b746e;font-variant-numeric:tabular-nums\">n={{ a.n }}<\u002Fspan>\n                    <span style=\"color:#6b746e;font-size:11px\">{{ a.corrected }}<\u002Fspan>\n                    <span style=\"text-align:right;color:#6b746e;font-variant-numeric:tabular-nums\">{{ a.proj }} → {{ a.actual }}<\u002Fspan>\n                    <span style=\"{{ a.biasStyle }}text-align:right\">{{ a.bias }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ accClear }}\" style=\"margin-top:11px;font-size:11.5px;color:#8b1e2b;cursor:pointer;text-decoration:underline\">Clear the projection log<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ accNone }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12px;color:#6b746e;line-height:1.65;text-wrap:pretty;background:#f8f7f2;border-radius:5px;padding:12px 14px\">{{ accEmpty }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ REFERENCE ============================ -->\n    <sc-if value=\"{{ isBrowse }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:14px;flex-wrap:wrap\">\n          <div style=\"font-family:Georgia,serif;font-size:18px\">Reference tables<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center\">\n            <sc-raw-select sc-camel-on-change=\"{{ onBrowseTab }}\" value=\"{{ browseTab }}\" style=\"font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid #dfe3df;border-radius:4px;background:#fff\">\n              <sc-for list=\"{{ browseTabs }}\" as=\"t\" hint-placeholder-count=\"8\">\n                <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <input type=\"text\" placeholder=\"Filter rows…\" value=\"{{ browseFilter }}\" sc-camel-on-change=\"{{ onBrowseFilter }}\" style=\"font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:6px 10px;border:1px solid #dfe3df;border-radius:4px;width:170px\">\n            <span style=\"font-size:12px;color:#6b746e\">{{ browseCount }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:auto;max-height:74vh\">\n          <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:12.5px\">\n            <sc-raw-thead><sc-raw-tr>\n              <sc-for list=\"{{ brHeaders }}\" as=\"h\" hint-placeholder-count=\"8\">\n                <sc-raw-th sc-camel-on-click=\"{{ h.go }}\" style=\"{{ h.style }}\">{{ h.label }}<\u002Fsc-raw-th>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ brRows }}\" as=\"r\" hint-placeholder-count=\"14\">\n                <sc-raw-tr>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"8\">\n                    <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #f1f2ee;white-space:nowrap\">{{ c }}<\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ RECORD ============================ -->\n    <sc-if value=\"{{ isRecord }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-shell=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start\">\n        <div>\n          <div style=\"font-family:Georgia,serif;font-size:18px;margin-bottom:4px\">Saved parlays<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b746e;line-height:1.6;margin-bottom:14px;max-width:70ch;text-wrap:pretty\">Every parlay you save is kept with the probability it was given at the time, then graded against final scores as the games finish. Stored in this browser only.<\u002Fdiv>\n\n          <sc-if value=\"{{ noTickets }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff;border:1px dashed #cfd4cd;border-radius:6px;padding:26px 22px;font-size:12.5px;color:#6b746e;line-height:1.65;text-wrap:pretty\">Nothing saved yet. Build a parlay on the Parlay tab and press Save parlay. The record starts from your first save; it cannot be backfilled, which is the point — a prediction only counts if it was written down before kickoff.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ tickets }}\" as=\"t\" hint-placeholder-count=\"0\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-left:4px solid {{ t.accent }};border-radius:6px;overflow:hidden\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;background:#f6f4ee;border-bottom:1px solid #eceee9\">\n                  <div>\n                    <div style=\"font-family:Georgia,serif;font-size:14px\">{{ t.title }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#6b746e;margin-top:2px\">{{ t.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px\">\n                    <div style=\"{{ t.badgeStyle }}\">{{ t.badge }}<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ t.remove }}\" style=\"font-size:15px;line-height:1;color:#a8b0a9;cursor:pointer\" title=\"Delete\">×<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:4px 14px 10px\">\n                  <sc-for list=\"{{ t.legs }}\" as=\"l\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #f3f4f0\">\n                      <div>\n                        <div style=\"font-size:12.5px\">{{ l.label }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#6b746e;margin-top:1px\">{{ l.sub }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12px;color:#4a564d;font-variant-numeric:tabular-nums\">{{ l.pct }}<\u002Fdiv>\n                      <div style=\"{{ l.resStyle }}\">{{ l.res }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:sticky;top:14px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#0b3d26;color:#f4f1ea;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:#d4a017;font-weight:700\">Leg calibration<\u002Fdiv>\n            <div style=\"font-family:Georgia,serif;font-size:42px;font-weight:700;line-height:1.05;margin:7px 0 2px;font-variant-numeric:tabular-nums\">{{ calHit }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#f4f1eabb;line-height:1.6;text-wrap:pretty\">{{ calNote }}<\u002Fdiv>\n            <sc-if value=\"{{ hasCal }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:12px;padding:10px 12px;background:#0e4a2d;border-left:3px solid #d4a017;border-radius:4px;font-size:11.5px;line-height:1.6;text-wrap:pretty\">{{ calVerdict }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:10px\">Ticket record<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ recStats }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:12px;border-bottom:1px solid #f1f2ee;padding-bottom:6px\">\n                  <span style=\"color:#4a564d\">{{ r.k }}<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">{{ r.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:3px\">By market<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin-bottom:10px\">Hit rate against what the numbers promised, split by market.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ recMarkets }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:12px;border-bottom:1px solid #f1f2ee;padding-bottom:6px\">\n                  <span style=\"color:#4a564d\">{{ r.k }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasTickets }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ clearTickets }}\" style=\"margin-top:12px;font-size:11.5px;color:#8b1e2b;cursor:pointer;text-decoration:underline\">Delete all saved parlays<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ BACKTEST ============================ -->\n    <sc-if value=\"{{ isBacktest }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-shell=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start\">\n        <div>\n          <div style=\"font-family:Georgia,serif;font-size:18px;margin-bottom:4px\">Backtest<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b746e;line-height:1.6;margin-bottom:14px;max-width:72ch;text-wrap:pretty\">Every weight in this model was reasoned, not fitted. This walks forward through completed games: for each one, team ratings are rebuilt from games played strictly before it, the model predicts, and the prediction is graded against the final score. Nothing the model was not entitled to know is used.<\u002Fdiv>\n\n          <div style=\"display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap\">\n            <sc-for list=\"{{ btSeasons }}\" as=\"b\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ b.go }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ btEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px dashed #cfd4cd;border-radius:6px;padding:26px 22px;font-size:12.5px;color:#6b746e;line-height:1.65;text-wrap:pretty\">{{ btEmptyNote }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ btHas }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff5e0;border:1px solid #e5c97a;border-left:4px solid #d4a017;border-radius:6px;padding:13px 16px;margin-bottom:14px\">\n              <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:#8a6d0b;font-weight:700\">Read every number below with this attached<\u002Fdiv>\n              <div style=\"font-size:12px;color:#5c4a12;line-height:1.6;margin-top:5px;text-wrap:pretty\">Seven of the fourteen factors can fire in a backtest. Weather and injuries have no free historical feed, and efficiency, coaching, turnover luck, pace and matchup all come from a snapshot describing today rather than the week being graded. This measures the ratings-and-context core, not the model as it runs on Sunday. There is also no historical closing line anywhere in this data, so nothing here is evidence of an edge against a sportsbook.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px\">\n              <sc-for list=\"{{ btCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:13px 15px\">\n                  <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#6b746e;font-weight:700\">{{ c.k }}<\u002Fdiv>\n                  <div style=\"font-family:Georgia,serif;font-size:27px;font-weight:700;line-height:1.15;margin:5px 0 2px;font-variant-numeric:tabular-nums;color:{{ c.tone }}\">{{ c.v }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#6b746e;line-height:1.5\">{{ c.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n              <div style=\"padding:12px 15px;border-bottom:1px solid #eceee9;background:#f6f4ee\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Calibration by stated confidence<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;margin-top:2px;line-height:1.5;text-wrap:pretty\">Average error hides this. A model claiming 75% that lands 55% is not slightly off, it is lying about how much it knows.<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ btBuckets }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:96px 1fr 130px;gap:12px;align-items:center;padding:10px 15px;border-bottom:1px solid #f3f4f0\">\n                  <div style=\"font-size:12px;font-weight:600;font-variant-numeric:tabular-nums\">{{ b.range }}<\u002Fdiv>\n                  <div style=\"position:relative;height:20px;background:#f1f2ee;border-radius:3px;overflow:hidden\">\n                    <div style=\"{{ b.claimBar }}\"><\u002Fdiv>\n                    <div style=\"{{ b.actualBar }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#4a564d;font-variant-numeric:tabular-nums;text-align:right\">{{ b.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:9px 15px;font-size:11px;color:#6b746e;display:flex;gap:14px;align-items:center\">\n                <span style=\"display:inline-flex;align-items:center;gap:5px\"><span style=\"width:10px;height:10px;background:#c9cfc8;border-radius:2px;display:inline-block\"><\u002Fspan>claimed<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;gap:5px\"><span style=\"width:10px;height:10px;background:#0b3d26;border-radius:2px;display:inline-block\"><\u002Fspan>actual<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n              <div style=\"padding:12px 15px;border-bottom:1px solid #eceee9;background:#f6f4ee\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Against the baselines<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;margin-top:2px;line-height:1.5;text-wrap:pretty\">Same games, three levels of knowledge. If the full model cannot beat a rule that only knows home teams win slightly more often, the fourteen factors are decoration.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 62px 66px 60px 56px;gap:10px;padding:8px 15px;border-bottom:1px solid #eceee9;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">\n                <div>Predictor<\u002Fdiv>\n                <div style=\"text-align:right\">MAE<\u002Fdiv>\n                <div style=\"text-align:right\">Straight up<\u002Fdiv>\n                <div style=\"text-align:right\">Brier<\u002Fdiv>\n                <div style=\"text-align:right\">Log loss<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ btBase }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style=\"{{ b.row }}\">\n                  <div>\n                    <div style=\"font-size:12.5px\">{{ b.label }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#6b746e\">{{ b.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums\">{{ b.mae }}<\u002Fdiv>\n                  <div style=\"font-size:12px;text-align:right;font-variant-numeric:tabular-nums\">{{ b.acc }}<\u002Fdiv>\n                  <div style=\"font-size:12px;text-align:right;font-variant-numeric:tabular-nums\">{{ b.brier }}<\u002Fdiv>\n                  <div style=\"font-size:12px;text-align:right;font-variant-numeric:tabular-nums\">{{ b.ll }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:11px 15px;font-size:11.5px;color:#8a6d0b;line-height:1.6;text-wrap:pretty\">{{ btBaseNote }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n              <div style=\"padding:12px 15px;border-bottom:1px solid #eceee9;background:#f6f4ee\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">What each factor is worth<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;margin-top:2px;line-height:1.5;text-wrap:pretty\">Every factor switched off one at a time, graded on the same games. The bar is a bootstrap interval, not the estimate: a bar crossing the centre line means the season cannot tell that factor from nothing.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ ablOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"display:grid;grid-template-columns:150px 1fr 66px 74px;gap:10px;padding:8px 15px;border-bottom:1px solid #eceee9;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">\n                    <div>Factor<\u002Fdiv>\n                    <div style=\"text-align:center\">hurts &nbsp;←&nbsp; 0 &nbsp;→&nbsp; helps<\u002Fdiv>\n                    <div style=\"text-align:right\">Error saved<\u002Fdiv>\n                    <div style=\"text-align:right\">Verdict<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ ablRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n                    <div style=\"display:grid;grid-template-columns:150px 1fr 66px 74px;gap:10px;align-items:center;padding:9px 15px;border-bottom:1px solid #f3f4f0\">\n                      <div>\n                        <div style=\"font-size:12.5px\">{{ a.label }}<\u002Fdiv>\n                        <div style=\"font-size:10px;color:#6b746e\">{{ a.n }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"position:relative;height:22px;background:#f7f8f5;border-radius:3px\">\n                        <div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#c2c9c1\"><\u002Fdiv>\n                        <div style=\"{{ a.bar }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"{{ a.meanStyle }}\">{{ a.mean }}<\u002Fdiv>\n                      <div style=\"{{ a.verdictStyle }}\">{{ a.verdict }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:11px 15px;font-size:11.5px;color:#4a564d;line-height:1.6;text-wrap:pretty\">{{ ablVerdict }}<\u002Fdiv>\n\n                  <sc-if value=\"{{ redHas }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"border-top:1px solid #dfe3df;background:#faf9f5;padding:14px 15px 15px\">\n                      <div style=\"font-family:Georgia,serif;font-size:14px;margin-bottom:3px\">Is turnover luck the same factor as efficiency?<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#6b746e;line-height:1.55;margin-bottom:11px;text-wrap:pretty\">The overlap check found their per-game contributions correlated. This drops both at once and compares the cost to dropping them one at a time.<\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:1fr auto;gap:6px 14px;max-width:400px;margin-bottom:11px\">\n                        <sc-for list=\"{{ redRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                          <div style=\"font-size:11.5px;color:#4a564d\">{{ r.k }}<\u002Fdiv>\n                          <div style=\"font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\">{{ r.v }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#4a564d;line-height:1.6;text-wrap:pretty\">{{ redText }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ ablNotRun }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:16px 15px\">\n                  <div sc-camel-on-click=\"{{ ablRun }}\" style=\"display:inline-block;cursor:pointer;font-size:12px;font-weight:600;padding:8px 15px;background:#0b3d26;color:#f4f1ea;border-radius:4px\">Run ablation<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#6b746e;margin-top:8px;line-height:1.55\">Re-grades the season once per factor. A few seconds.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n              <div style=\"padding:12px 15px;border-bottom:1px solid #eceee9;background:#f6f4ee\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Are two factors saying the same thing?<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;margin-top:2px;line-height:1.5;text-wrap:pretty\">Factors that move together on the same games are one adjustment applied twice. Correlated on this week's slate, since efficiency and turnover luck only exist for today.<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ ovRows }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <div style=\"display:grid;grid-template-columns:1fr 130px 52px 120px;gap:10px;align-items:center;padding:9px 15px;border-bottom:1px solid #f3f4f0\">\n                  <div style=\"font-size:12.5px\">{{ o.pair }}<\u002Fdiv>\n                  <div style=\"position:relative;height:20px;background:#f7f8f5;border-radius:3px\">\n                    <div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#c2c9c1\"><\u002Fdiv>\n                    <div style=\"{{ o.bar }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ o.rStyle }}\">{{ o.r }}<\u002Fdiv>\n                  <div style=\"{{ o.vStyle }}\">{{ o.verdict }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:11px 15px;font-size:11.5px;color:#4a564d;line-height:1.6;text-wrap:pretty\">{{ ovNote }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n              <div style=\"padding:12px 15px;border-bottom:1px solid #eceee9;background:#f6f4ee\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Home-field weight sweep<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;margin-top:2px;line-height:1.5;text-wrap:pretty\">The home factor shifts every projection by a constant, so its whole error curve can be traced from two passes. This grades each candidate home edge against the same season and marks the one with the lowest average error.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ swOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"display:grid;grid-template-columns:104px 1fr 66px 62px 54px;gap:10px;padding:8px 15px;border-bottom:1px solid #eceee9;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">\n                    <div>Home edge<\u002Fdiv>\n                    <div>Lower error →<\u002Fdiv>\n                    <div style=\"text-align:right\">MAE<\u002Fdiv>\n                    <div style=\"text-align:right\">Straight up<\u002Fdiv>\n                    <div><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ swRows }}\" as=\"r\" hint-placeholder-count=\"9\">\n                    <div style=\"{{ r.row }}\">\n                      <div>\n                        <div style=\"font-size:12px;font-weight:600;font-variant-numeric:tabular-nums\">{{ r.label }}<\u002Fdiv>\n                        <div style=\"font-size:10px;color:#6b746e\">{{ r.sub }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"position:relative;height:18px;background:#f1f2ee;border-radius:3px;overflow:hidden\">\n                        <div style=\"{{ r.bar }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12px;text-align:right;font-variant-numeric:tabular-nums\">{{ r.mae }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;text-align:right;color:#4a564d;font-variant-numeric:tabular-nums\">{{ r.su }}<\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ r.apply }}\" style=\"{{ r.applyStyle }}\">{{ r.applyLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:11px 15px;font-size:11.5px;color:#4a564d;line-height:1.6;text-wrap:pretty\">{{ swVerdict }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ swNotRun }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:16px 15px\">\n                  <div sc-camel-on-click=\"{{ swRun }}\" style=\"display:inline-block;cursor:pointer;font-size:12px;font-weight:600;padding:8px 15px;background:#0b3d26;color:#f4f1ea;border-radius:4px\">Run sweep<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#6b746e;margin-top:8px;line-height:1.55\">Two extra walk-forward passes over the season. A few seconds.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden\">\n              <div style=\"padding:12px 15px;border-bottom:1px solid #eceee9;background:#f6f4ee;font-family:Georgia,serif;font-size:15px\">Worst misses<\u002Fdiv>\n              <sc-for list=\"{{ btWorst }}\" as=\"w\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:9px 15px;border-bottom:1px solid #f3f4f0\">\n                  <div style=\"font-size:12.5px\">{{ w.game }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#6b746e;font-variant-numeric:tabular-nums\">{{ w.detail }}<\u002Fdiv>\n                  <div style=\"font-size:12px;font-weight:700;color:#8b1e2b;font-variant-numeric:tabular-nums\">{{ w.err }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"position:sticky;top:14px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#0b3d26;color:#f4f1ea;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:#d4a017;font-weight:700\">Verdict<\u002Fdiv>\n            <div style=\"font-family:Georgia,serif;font-size:15px;line-height:1.5;margin:8px 0 0;text-wrap:pretty\">{{ btVerdict }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:4px\">What this cannot measure<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#4a564d;line-height:1.65;text-wrap:pretty\">Seven of the fourteen factors can fire here: home field, rest, travel, time zones, body clock, strength of schedule and division familiarity. The other seven cannot — weather and injuries have no free historical feed, and efficiency, coaching, turnover luck, pace and positional matchup all live on the snapshot, which describes today rather than the week being graded. So this measures the ratings and schedule-context core, not the full model as it runs on Sunday. There are no historical closing lines either, so there is no record against the spread here — that is what Line moves accumulates going forward.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:4px\">Reading it<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#4a564d;line-height:1.65;text-wrap:pretty\">Mean absolute error is the number that matters. Sportsbooks land near 10 points; anything under 11 is respectable and under 10 would be surprising. The baseline is what you would get predicting a 2.2-point home win in every game — beating it is the minimum bar for the factor model earning its complexity.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ SOURCES ============================ -->\n    <sc-if value=\"{{ isSources }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-shell=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start\">\n        <div>\n          <div style=\"font-family:Georgia,serif;font-size:18px;margin-bottom:4px\">Where every number comes from<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b746e;line-height:1.6;margin-bottom:12px\">Fetched fresh on load. Anything that failed says so rather than falling back silently.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ provenance }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:12px 14px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n                  <div style=\"font-family:Georgia,serif;font-size:14px;font-weight:700\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"{{ p.badgeStyle }}\">{{ p.badge }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-top:5px\">{{ p.detail }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#8a938c;font-family:ui-monospace,monospace;margin-top:5px;word-break:break-all\">{{ p.src }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #d4a017;border-radius:6px;padding:14px 16px;margin-top:12px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:4px\">Keep the snapshot updating on its own<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:9px;text-wrap:pretty\">{{ snapUrlIntro }}<\u002Fdiv>\n            <input type=\"text\" value=\"{{ snapUrl }}\" sc-camel-on-change=\"{{ onSnapUrl }}\" placeholder=\"https://raw.githubusercontent.com/you/repo/main/nfl-report.html\" style=\"width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:9px 10px;border:1px solid #dfe3df;border-radius:4px;background:#fbfbf8;color:#12201a\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ saveSnapUrl }}\" style=\"font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:4px;background:#0b3d26;color:#f4f1ea;cursor:pointer\">Save and reload<\u002Fdiv>\n              <sc-if value=\"{{ hasSnapUrl }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ clearSnapUrl }}\" style=\"font-size:11.5px;color:#8b1e2b;cursor:pointer;text-decoration:underline\">Stop using it<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ snapStatus }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"{{ snapStatusStyle }}\">{{ snapStatus }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:11px;color:#8a938c;line-height:1.6;margin-top:7px;font-family:ui-monospace,monospace;word-break:break-all\">{{ snapFromNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:14px 16px;margin-top:12px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:4px\">Paste in a fresh snapshot<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:9px;text-wrap:pretty\">{{ snapPasteNote }}<\u002Fdiv>\n            <textarea sc-camel-on-change=\"{{ onSnapText }}\" placeholder=\"Paste the generator report, nfl-data.js, or the JSON object here\" style=\"width:100%;box-sizing:border-box;min-height:78px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;padding:9px 10px;border:1px solid #dfe3df;border-radius:4px;background:#fbfbf8;color:#12201a\"><\u002Ftextarea>\n            <div style=\"display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ applySnap }}\" style=\"font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:4px;background:#0b3d26;color:#f4f1ea;cursor:pointer\">Load snapshot<\u002Fdiv>\n              <sc-if value=\"{{ hasSavedSnap }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ dropSnap }}\" style=\"font-size:11.5px;color:#8b1e2b;cursor:pointer;text-decoration:underline\">Remove stored snapshot<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ snapMsg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"{{ snapMsgStyle }}\">{{ snapMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-family:Georgia,serif;font-size:18px;margin-bottom:4px\">Factor weights<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b746e;line-height:1.6;margin-bottom:12px\">Every weight in the model, adjustable. 100% is the default; 0% removes the factor. Changes re-run every simulation immediately.<\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:6px 16px 14px\">\n            <sc-for list=\"{{ weightRows }}\" as=\"w\" hint-placeholder-count=\"13\">\n              <div style=\"padding:11px 0;border-bottom:1px solid #f1f2ee\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n                  <span style=\"font-size:13px;font-weight:600\">{{ w.label }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#0b3d26\">{{ w.pct }}<\u002Fspan>\n                <\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"200\" step=\"10\" value=\"{{ w.val }}\" sc-camel-on-change=\"{{ w.on }}\" style=\"width:100%;margin:6px 0 4px\">\n                <div style=\"font-size:11px;color:#6b746e;line-height:1.55\">{{ w.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div sc-camel-on-click=\"{{ resetWeights }}\" style=\"margin-top:12px;display:inline-block;font-size:12px;font-weight:600;padding:7px 13px;border:1px solid #dfe3df;border-radius:4px;cursor:pointer\">Reset to defaults<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:14px 16px;margin-top:12px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:4px\">Your generator in the model<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:10px\">{{ genNote }}<\u002Fdiv>\n            <div style=\"display:flex;gap:5px\">\n              <sc-for list=\"{{ genOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin:18px 0 4px;padding-top:14px;border-top:1px solid #f1f2ee\">Lineup uncertainty<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:10px\">{{ varNote }}<\u002Fdiv>\n            <div style=\"display:flex;gap:5px\">\n              <sc-for list=\"{{ varOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin:18px 0 4px;padding-top:14px;border-top:1px solid #f1f2ee\">Conservatism<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:10px\">{{ shrinkNote }}<\u002Fdiv>\n            <div style=\"display:flex;gap:5px\">\n              <sc-for list=\"{{ shrinkOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:14px 16px;margin-top:12px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:4px\">Market anchor<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-bottom:10px\">{{ anchorNote }}<\u002Fdiv>\n            <div style=\"display:flex;gap:5px\">\n              <sc-for list=\"{{ anchorOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#4a564d;line-height:1.6;margin-top:10px;padding-top:9px;border-top:1px solid #f1f2ee\">{{ anchorState }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:14px 16px;margin-top:12px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:8px\">Simulation trials per game<\u002Fdiv>\n            <div style=\"display:flex;gap:5px\">\n              <sc-for list=\"{{ trialOptions }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-top:9px\">{{ trialsNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:24px;font-size:11px;color:#8a938c;line-height:1.65;max-width:1000px\">{{ footer }}<\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;games&quot;,&quot;parlay&quot;,&quot;fantasy&quot;,&quot;browse&quot;,&quot;sources&quot;],&quot;default&quot;:&quot;games&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst F = '#0b3d26', GOLD = '#d4a017', OK = '#2e7d4f', RED = '#8b1e2b', DIM = '#6b746e';\n\n// Final NFL margins are close to normal with a standard deviation near 13.5\n// points, so a projected margin converts to a win probability through that CDF.\n// This is the curve the market prices on: 3 points is ~59%, 7 is ~70%.\nconst BUILD = Date.now();\nconst MARGIN_SD = 13.5;\nconst normCdf = z => {\n  const s = z < 0 ? -1 : 1, x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);\n  const poly = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t;\n  return 0.5 * (1 + s * (1 - poly * Math.exp(-x * x)));\n};\n\nclass Component extends DCLogic {\n  state = {\n    snap: null, live: null, ratings: null, teams: null,\n    season: null, week: null, wx: {}, status: {},\n    progress: 'Starting up\\u2026', fatal: null,\n    view: null, sel: null, weights: {}, trials: 50000, ouLine: null, fpQuery: '',\n    picks: {}, comboN: 3, comboAll: true, src: 'model', anchor: 'auto', btSeason: null,\n    pos: 'ALL', team: 'ALL', minPts: 0, divOnly: false, healthyOnly: false,\n    fpSort: 'Projected', fpDir: -1,\n    browseTab: 'Team Records', browseFilter: '', brSort: null, brDir: 1\n  };\n\n  simCache = {};\n  fpCache = {};\n\n  BUILD = '2026-09-06 e';\n\n  // A phone will happily serve yesterday's copy of this file for days, and a\n  // home-screen shortcut is worse. So the page asks the server for itself,\n  // bypassing the cache, and compares build stamps. Finding a newer one only\n  // offers the update — reloading unasked would throw away whatever is on\n  // screen. The fetch has already refreshed the HTTP cache, so the reload gets\n  // the new copy.\n  checkBuild() {\n    if (typeof window === 'undefined' || !window.fetch) return;\n    const url = location.pathname + '?_b=' + Date.now();\n    fetch(url, { cache: 'reload' }).then(r => r.ok ? r.text() : null).then(txt => {\n      if (!txt) return;\n      const m = txt.match(/BUILD\\s*=\\s*'([^']+)'/);\n      if (m && m[1] && m[1] !== this.BUILD) this.setState({ newBuild: m[1] });\n    }).catch(() => {});\n  }\n\n  componentDidMount() {\n    this.loadAll();\n    this.autoDk();\n    setTimeout(() => this.checkBuild(), 4000);\n    this._esc = e => { if (e.key === 'Escape' && this.state.sel) this.closePick(); };\n    if (typeof window !== 'undefined') window.addEventListener('keydown', this._esc);\n  }\n  componentWillUnmount() {\n    if (typeof window !== 'undefined' && this._esc) window.removeEventListener('keydown', this._esc);\n  }\n\n  // DraftKings prices the current slate through a feed a browser may read, so\n  // its salaries arrive on their own. A pasted list is never overwritten — that\n  // is the only way to get FanDuel, which publishes nothing readable.\n  autoDk() {\n    const st = this.salStore();\n    if (st && st.count && (st.src === 'paste' || (Date.now() - (st.at || 0)) < 6 * 3600e3)) return;\n    this.loadFeed(this.state.salBook || 'dk', true);\n  }\n  // Both books are committed to the repo by the salary workflow, so a phone\n  // reads one small file instead of talking to either sportsbook. DraftKings\n  // falls back to its own live feed if the file is missing; FanDuel cannot,\n  // which is the whole reason the workflow exists.\n  async loadFeed(book, quiet) {\n    if (this._dkBusy) return false;\n    const name = book === 'fd' ? 'FanDuel' : 'DraftKings';\n    this._dkBusy = true;\n    if (!quiet) this.setState({ salMsg: 'Reading committed ' + name + ' prices\\u2026', salOk: true });\n    try {\n      const r = await fetch('data/salaries.json?t=' + Date.now(), { cache: 'no-store' });\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      const j = await r.json();\n      const src = (j.sources || {})[book];\n      if (!src || !(src.players || []).length) throw new Error('no ' + name + ' prices in the file');\n      const map = {}, ids = {}, def = {};\n      let count = 0;\n      src.players.forEach(p => {\n        const k = this.nameKey(p.name);\n        if (k) { map[k] = p.salary; count++; }\n        if (p.id != null) ids[String(p.id)] = p.salary;\n      });\n      Object.keys(src.def || {}).forEach(t => {\n        const tm = this.teamAbbr(t);\n        if (tm) { def[tm] = src.def[t]; count++; }\n      });\n      const at = j.generated ? new Date(j.generated).getTime() : Date.now();\n      const rec = { count, map, ids, def, at, src: book, cap: src.cap,\n        slate: (src.slate || name) + (src.stale ? ' \\u00b7 last good fetch' : '') };\n      try { localStorage.setItem(this.salKey(), JSON.stringify(rec)); } catch (err) {}\n      this._dkBusy = false;\n      this.setState({ salBook: book, salCapDraft: null, salMsg: name + ' prices loaded \\u2014 '\n        + count + ' priced off the ' + rec.slate + ', committed ' + this.ago(Date.now() - at) + '.', salOk: true });\n      return true;\n    } catch (e) {\n      this._dkBusy = false;\n      if (book === 'dk') return this.loadDk(quiet);\n      this.setState({ salBook: book, salMsg: 'No FanDuel prices in the repo yet (' + (e.message || 'fetch failed')\n        + '). The salary workflow commits them once FANTASY_NERDS_KEY is set; paste a list below in the meantime.', salOk: false });\n      return false;\n    }\n  }\n  async loadDk(quiet) {\n    if (this._dkBusy) return;\n    this._dkBusy = true;\n    if (!quiet) this.setState({ salMsg: 'Asking DraftKings for this week\\u2019s prices\\u2026', salOk: true });\n    try {\n      const list = await (await fetch('https://api.draftkings.com/draftgroups/v1/')).json();\n      const now = Date.now();\n      const nfl = (list.draftGroups || []).filter(g => g.contestType\n        && g.contestType.sport === 'NFL' && g.contestType.gameType === 'SalaryCap'\n        && (g.games || []).length > 1);\n      const ahead = [], behind = [];\n      nfl.forEac eturn p >= 50 ? '-' + Math.round(p / (100 - p) * 100)\n        : '+' + Math.round((100 - p) / p * 100);\n    };\n    const legOf = (g, sm, kind, isHome, label, line) => {\n      const key = g.id + '|' + kind + '|' + (isHome ? 'h' : 'a');\n      const leg = {\n        key, gid: g.id, kind, home: isHome, line: line == null ? null : line,\n        label, matchup: g.away + ' @ ' + g.home\n      };\n      leg.mprob = this.M.legProb(sm, leg);\n      let prob = leg.mprob;\n      // Market source now prices every market, not just the moneyline: spread\n      // and total legs are read off the market's own implied distribution.\n      if (s.src === 'market') {\n        const mp = this.L.marketLegProb(leg, g.market, g.spread, g.total);\n        if (mp != null) prob = mp;\n      } else if (s.src === 'generator' && kind === 'ml' && g.gen) {\n        prob = isHome ? g.gen.home : g.gen.away;\n      }\n      leg.prob = prob;\n      // Stamp the market as it stood when this leg was taken. Without it a\n      // saved ticket can only be graded on whether it won, which is the\n      // question luck answers. With it, the ticket can later be checked against\n      // the closing number — the only test that separates a good price from a\n      // lucky result.\n      leg.mktAt = this.L.marketLegProb(leg, g.market, g.spread, g.total);\n      leg.spreadAt = g.spread == null ? null : g.spread;\n      leg.totalAt = g.total == null ? null : g.total;\n      leg.kickoff = g.kickoff || g.date || null;\n      const picked = !!s.picks[key];\n      return {\n        label, pct: prob.toFixed(0) + '%', picked,\n        am: this.american(prob),\n        style: 'padding:7px 9px;border-radius:4px;cursor:pointer;border:1px solid '\n          + (picked ? OK : '#e3e7e2') + ';background:' + (picked ? '#eaf5ee' : '#fff')\n          + ';box-shadow:' + (picked ? 'inset 0 0 0 1px ' + OK : 'none'),\n        go: () => this.setState(st => {\n          const picks = Object.assign({}, st.picks);\n          if (pic g ? { sim: this.sim(g), legs: byGame[gid] } : null;\n    }).filter(Boolean);\n    const combined = picks.length ? this.jointAdj(groups) : 1;\n    const outc = picks.length ? this.M.jointOutcome(groups) : { win: 1, push: 0, fair: 1 };\n    const pushShare = outc.push;\n    const naive = picks.reduce((a, p) => a * (p.prob / 100), 1);\n    const corrGames = Object.keys(byGame).filter(k => byGame[k].length > 1).length;\n\n    v.comboLabel = 'Your parlay \\u00b7 ' + (s.src === 'model' ? 'model odds' : s.src === 'market' ? 'market odds' : 'your generator');\n    v.comboPct = picks.length ? (combined * 100).toFixed(1) + '%' : '\\u2014';\n    v.comboSub = picks.length === 0 ? 'No legs yet. Click any market to build a parlay.'\n      : picks.length === 1 ? 'One leg. Add another for combined odds.'\n      : s.src === 'model'\n        ? 'Chance all ' + picks.length + ' legs land, from the same ' + s.trials.toLocaleString() + ' simulated games'\n        : 'Chance all ' + picks.length + ' legs land at ' + (s.src === 'market' ? 'market' : 'generator')\n          + ' prices, with same-game correlation carried over from the simulations';\n    v.hasFairOdds = picks.length >= 2 && combined > 0;\n    v.fairOdds = v.hasFairOdds ? '+' + Math.round((1 / combined - 1) * 100) : '';\n\n    // Pushes are a third outcome, not a loss and not a win. Sportsbooks drop the\n    // pushed leg and pay the rest, so a parlay with a whole-number line is worth\n    // more than its strict all-legs-win number — but only the strict number is\n    // the chance of the ticket you actually wrote.\n    v.hasPush = pushShare > 0.005;\n    v.pushText = v.hasPush\n      ? (pushShare * 100).toFixed(1) + '% of simulations land exactly on one of your lines. '\n        + 'Those trials push rather than lose — the book voids that leg and pays the rest — which values the ticket nearer '\n        + (outc.fair * 100).toFixed(1) + '%. The headline stays at the strict number: every leg landing.'\n      : '';\n\n    v.hasCorr = corrGames > 0 && picks.length >= 2;\n    v.corrText = v.hasCorr\n      ? 'Multiplying the legs separately would say ' + (naive * 100).toFixed(1) + '%. '\n        + 'Because ' + (corrGames === 1 ? 'two or more legs sit in the same game' : corrGames + ' games carry multiple legs')\n        + ', the honest number is ' + (combined * 100).toFixed(1) + '% \\u2014 counted from simulations where every leg had to land together.'\n      : '';\n\n    const weak = picks.length > 1 ? picks.slice().sort((a, b) => a.prob - b.prob)[0] : null;\n    v.hasWeak = !!weak;\n    if (weak) {\n      const rest = groups.map(gr => ({ sim: gr.sim, legs: gr.legs.filter(l => l !== weak) }))\n        .filter(gr => gr.legs.length);\n      const without = this.jointAdj(rest);\n      v.weakText = weak.label + ' at ' + weak.prob.toFixed(0) + '%. Drop it and the parlay goes to '\n        + (without * 100).toFixed(1) + '%.';\n    }\n    v.pickList = picks.slice().sort((a, b) => a.prob - b.prob).map(p => ({\n      label: p.label + '  (' + p.matchup + ')', pct: p.prob.toFixed(0) + '%',\n      pctStyle: `font-weight:700;font-variant-numeric:tabular-nums;color:${p.prob < 55 ? '#f0a5ad' : '#f4f1ea'}`\n    }));\n    v.clearPicks = () => set({ picks: {} });\n\n    v.saveTicketLabel = picks.length ? 'Save parlay' : 'Nothing to save';\n    v.saveTicketStyle = 'font-size:11.5px;font-weight:600;padding:8px 13px;border-radius:4px;'\n      + (picks.length\n        ? 'background:#d4a017;color:#12201a;cursor:pointer'\n        : 'background:#ffffff1a;color:#f4f1ea77;cursor:default');\n    v.saveTicket = () => {\n      if (!picks.length) return;\n      this.L.saveTicket({\n        src: s.src, season: s.season, week: s.week, combined,\n        at: Date.now(), trials: s.trials, weights: s.weights,\n        legs: picks.map(p => ({\n          gid: p.gid, kind: p.kind, home: p.home, line: p.line,\n          label: p.label, matchup: p.matchup, prob: p.prob,\n          mktAt: p.mktAt == null ? null : p.mktAt,\n          spreadAt: p.spreadAt == null ? null : p.spreadAt,\n          totalAt: p.totalAt == null ? null : p.totalAt,\n          kickoff: p.kickoff || null\n        }))\n      });\n      set({ view: 'record' });\n    };\n\n\n    // Candidate legs for the safest combo. Every market gets a candidate, not\n    // just the moneyline, and only the better side of each — the other side is\n    // by definition the less likely one.\n    const sims = {};\n    const simOf = g => (sims[g.id] = sims[g.id] || this.sim(g));\n    const cand = [];\n    slate.forEach(g => {\n      const sm = simOf(g);\n      const push = (kind, isHome, label, line) => {\n        const leg = {\n          key: g.id + '|' + kind + '|' + (isHome ? 'h' : 'a'), gid: g.id, kind,\n          home: isHome, line: line == null ? null : line, label,\n          team: isHome ? g.home : g.away, matchup: g.away + ' @ ' + g.home\n        };\n        leg.mprob = this.M.legProb(sm, leg);\n        leg.prob = leg.mprob;\n        if (s.src === 'market') {\n          const mp = this.L.marketLegProb(leg, g.market, g.spread, g.total);\n          if (mp != null) leg.prob = mp;\n        }\n        cand.push(leg);\n      };\n      const h = this.probFor(g, 'home'), a = this.probFor(g, 'away');\n      const mlHome = h >= a;\n      push('ml', mlHome, mlHome ? g.home : g.away, null);\n      // Keep the selected odds source honest for moneylines.\n      const ml = cand[cand.length - 1];\n      if (s.src !== 'model') ml.prob = mlHome ? h : a;\n      if (s.comboAll && g.spread != null) {\n        const homeCovers = this.M.legProb(sm, { kind: 'spread', home: true, line: g.spread }) >= 50;\n        push('spread', homeCovers,\n          homeCovers\n            ? (g.spread > 0 ? g.home + ' -' + g.spread : g.home + ' +' + Math.abs(g.spread))\n            : (g.spread > 0 ? g.away + ' +' + g.spread : g.away + ' -' + Math.abs(g.spread)),\n          g.spread);\n      }\n      if (s.comboAll && g.total != null) {\n        const over = this.M.legProb(sm, { kind: 'over', home: true, line: g.total }) >= 50;\n        push(over ? 'over' : 'under', over, (over ? 'Over ' : 'Under ') + g.total, g.total);\n      }\n    });\n\n    // Greedy selection on the joint number rather than on each leg alone. Legs\n    // in the same game interact, so the highest pair is not always the two\n    // highest singles — a team winning and that game staying under fight each\n    // other, while winning and going over often help.\n    const pool = cand.slice().sort((x, y) => y.prob - x.prob).slice(0, 26);\n    const jointOf = ls => {\n      const by = {};\n      ls.forEach(l => { (by[l.gid] = by[l.gid] || []).push(l); });\n      return this.jointAdj(Object.keys(by).map(gid => ({\n        sim: sims[gid], legs: by[gid]\n      })));\n    };\n    const best = [];\n    while (best.length < s.comboN) {\n      let pick = null, pickP = -1;\n      for (const c of pool) {\n        if (best.some(b => b.key === c.key)) continue;\n        // Never two legs from the same market in one game.\n        if (best.some(b => b.gid === c.gid && b.kind === c.kind)) continue;\n        const p = jointOf(best.concat([c]));\n        if (p > pickP) { pickP = p; pick = c; }\n      }\n      if (!pick) break;\n      best.push(pick);\n    }\n    v.comboMarkets = [[false, 'Moneyline only'], [true, 'All markets']].map(([k, label]) =>\n      this.pill(!!s.comboAll === k, label, () => set({ comboAll: k }), '6px 10px'));\n    v.comboSizes = [2, 3, 4, 5, 6].map(n => Object.assign(this.pill(s.comboN === n, String(n), () => set({ comboN: n }), '6px 11px'), { n }));\n    v.safePct = (best.length ? jointOf(best) * 100 : 0).toFixed(1) + '%';\n    v.safeTeams = best.map(p => (p.kind === 'over' || p.kind === 'under' ? p.matchup + ' ' : '') + p.label + ' ' + p.prob.toFixed(0) + '%').join(' \\u00b7 ');\n    v.applySafe = () => { const picks = {}; best.forEach(p => { picks[p.key] = p; }); set({ picks }); };\n\n    // ---------------- record ----------------\n    // Graded against the schedule's own final scores, so tickets from earlier\n    // weeks settle without keeping any results of our own.\n    const trows = this.L.gradeTickets(s.live || []);\n    const tsum = this.L.ticketSummary(trows);\n    const resTone = { win: OK, loss: RED, push: '#8a6d0b', open: DIM, void: DIM };\n    v.hasTickets = trows.length > 0;\n    v.noTickets = trows.length === 0;\n    v.tickets = trows.map(t => ({\n      title: t.legs.length + '-leg parlay'\n        + (t.combined ? ' \\u00b7 ' + (t.combined * 100).toFixed(1) + '%' : ''),\n      sub: [new Date(t.at).toLocaleString(undefined,\n        { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),\n        t.season ? t.season + ' week ' + t.week : null,\n        t.src === 'model' ? 'model odds' : t.src === 'market' ? 'market odds' : 'generator odds',\n        t.trials ? t.trials.toLocaleString() + ' trials' : null\n      ].filter(Boolean).join(' \\u00b7 '),\n      accent: t.status === 'win' ? OK : t.status === 'loss' ? RED : GOLD,\n      badge: t.status === 'open' ? t.open + ' still to play' : t.status === 'win' ? 'Hit' : 'Missed',\n      badgeStyle: 'font-size:9.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:2px 6px;border-radius:3px;'\n        + (t.status === 'win' ? 'background:#e6f0e9;color:#2e7d4f'\n          : t.status === 'loss' ? 'background:#f7e7e9;color:#8b1e2b'\n          : 'background:#f6efdb;color:#8a6d0b'),\n      remove: () => { this.L.deleteTicket(t.id); this.forceUpdate(); },\n      legs: t.legs.map(l => {\n        // How early the bet was placed, and what the market said at that moment.\n        // A ticket taken twelve hours out against a line that later moved your\n        // way is a different result from the same ticket taken at kickoff.\n        const lead = l.kickoff && t.at\n          ? (new Date(l.kickoff).getTime() - t.at) / 3600000 : null;\n        const stamp = [\n          lead != null && lead > 0\n            ? (lead >= 48 ? Math.round(lead / 24) + 'd' : Math.round(lead) + 'h') + ' before kickoff'\n            : null,\n          l.mktAt != null ? 'market said ' + (l.mktAt * 100).toFixed(0) + '%' : null,\n          l.kind === 'spread' && l.spreadAt != null ? 'line ' + l.spreadAt\n            : (l.kind === 'over' || l.kind === 'under') && l.totalAt != null ? 'total ' + l.totalAt : null\n        ].filter(Boolean).join(' \\u00b7 ');\n        return {\n        label: (l.kind === 'over' || l.kind === 'under' ? l.matchup + ' ' : '') + l.label,\n        sub: [l.score || l.matchup, stamp].filter(Boolean).join('  \\u2014  '),\n        pct: l.prob != null ? l.prob.toFixed(0) + '%' : '',\n        res: l.result === 'open' ? 'to play' : l.result,\n        resStyle: 'font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:'\n          + (resTone[l.result] || DIM)\n        };\n      })\n    }));\n\n    v.hasCal = tsum.legs >= 5;\n    v.calHit = tsum.hitPct == null ? '\\u2014' : tsum.hitPct.toFixed(0) + '%';\n    v.calNote = tsum.legs\n      ? tsum.hits + ' of ' + tsum.legs + ' settled legs landed. The numbers promised '\n        + tsum.expPct.toFixed(0) + '%.'\n      : 'No legs have finished yet. This fills in as the games are played.';\n    const gap = tsum.legs ? tsum.hitPct - tsum.expPct : 0;\n    v.calVerdict = !v.hasCal ? ''\n      : Math.abs(gap) < 4\n        ? 'Within four points of what was promised \\u2014 the probabilities are behaving.'\n        : gap > 0\n          ? 'Landing ' + gap.toFixed(0) + ' points more often than promised. Pleasant, but it means the numbers are too cautious.'\n          : 'Landing ' + Math.abs(gap).toFixed(0) + ' points less often than promised. Treat these percentages as optimistic until the gap closes.';\n    v.recStats = [\n      { k: 'Parlays saved', v: String(tsum.tickets) },\n      { k: 'Still open', v: String(tsum.open) },\n      { k: 'Settled', v: String(tsum.settled) },\n      { k: 'Tickets hit', v: tsum.settled ? tsum.ticketsWon + ' of ' + tsum.settled : '\\u2014' },\n      { k: 'Legs settled', v: String(tsum.legs) }\n    ];\n    v.recMarkets = ['ml', 'spread', 'total'].map(k => {\n      const m = tsum.byMarket[k];\n      return {\n        k: k === 'ml' ? 'Moneyline' : k === 'spread' ? 'Spread' : 'Total',\n        v: !m ? '\\u2014' : m.hits + '/' + m.n + ' \\u00b7 ' + (m.hits / m.n * 100).toFixed(0)\n          + '% vs ' + (m.expected / m.n * 100).toFixed(0) + '% promised'\n      };\n    });\n    v.clearTickets = () => { this.L.clearTickets(); this.forceUpdate(); };\n\n    // ---------------- backtest ----------------\n    // Expensive: ratings are rebuilt for every game date in the season. Only\n    // run it when the tab is open, and keep the result.\n    if (view === 'backtest') {\n      const seasonsAvail = Array.from(new Set((s.live || [])\n        .filter(g => g.played && g.type === 'REG').map(g => g.season)))\n        .sort((a, b) => b - a).slice(0, 4);\n      const btSeason = s.btSeason || seasonsAvail[0] || null;\n      v.btSeasons = seasonsAvail.map(y => this.pill(y === btSeason, String(y),\n        () => set({ btSeason: y }), '7px 13px'));\n\n      const ck = 'bt' + btSeason + '|' + JSON.stringify(s.weights) + '|' + (s.ablOn ? 'a' : '');\n      let bt = this._btCache && this._btCache.key === ck ? this._btCache.val : null;\n      if (!bt && btSeason) {\n        const btGame = g => ({\n          home: g.home, away: g.away, division: g.division,\n          homeRest: g.homeRest, awayRest: g.awayRest,\n          kickoffHourET: this.L.kickoffHourET(g),\n          // Weather and injuries are unknowable retroactively, so they are off.\n          weather: null, homeInjury: 0, awayInjury: 0\n        });\n        const zero = {};\n        (this.M.FACTORS || []).forEach(f => { zero[f.key] = 0; });\n        // Ablation variants: one predictor per factor, identical to the full\n        // model except that factor is switched off. Built only when asked for,\n        // since each one is another projection per game.\n        let variants = null;\n        if (s.ablOn) {\n          variants = {};\n          (this.M.FACTORS || []).forEach(f => {\n            const w = Object.assign({}, s.weights); w[f.key] = 0;\n            variants[f.key] = (g, ratings) =>\n              this.M.projectMargin(btGame(g), ratings, { weights: w });\n          });\n          // One extra variant with BOTH halves of the suspected-redundant pair\n          // off. Dropping two independent factors should cost about the sum of\n          // dropping each alone; if it costs no more than the worse of the two,\n          // they are one signal charged twice.\n          const fk = (this.M.FACTORS || []).map(f => f.key);\n          if (fk.indexOf('toluck') >= 0 && fk.indexOf('eff') >= 0) {\n            const w = Object.assign({}, s.weights); w.toluck = 0; w.eff = 0;\n            variants.__pair = (g, ratings) =>\n              this.M.projectMargin(btGame(g), ratings, { weights: w });\n          }\n        }\n        const rows = this.L.backtest(s.live || [],\n          (g, ratings) => this.M.projectMargin(btGame(g), ratings, { weights: s.weights }),\n          { season: btSeason, variants,\n            raw: (g, ratings) => this.M.projectMargin(btGame(g), ratings, { weights: zero }) });\n        bt = { rows, sum: this.L.backtestSummary(rows) };\n        this._btCache = { key: ck, val: bt };\n      }\n      const sum = bt ? bt.sum : { n: 0 };\n      v.btHas = sum.n > 0;\n      v.btEmpty = !sum.n;\n      v.btEmptyNote = !btSeason\n        ? 'No completed regular-season games are loaded yet, so there is nothing to grade.'\n        : 'Not enough games in ' + btSeason + ' yet. Each team needs four prior games before its rating is worth predicting from, so a backtest only becomes meaningful around week five.';\n\n      if (sum.n) {\n        const tone = sum.mae <= 10.5 ? OK : sum.mae <= 12 ? '#8a6d0b' : RED;\n        v.btCards = [\n          { k: 'Mean abs error', v: sum.mae.toFixed(2), tone,\n            note: 'points of margin, across ' + sum.n + ' games' },\n          { k: 'Straight up', v: sum.accuracy.toFixed(1) + '%', tone: '#12201a',\n            note: sum.correct + ' of ' + sum.graded + ' winners' },\n          { k: 'vs baseline', v: (sum.edge >= 0 ? '+' : '\\u2212') + Math.abs(sum.edge).toFixed(2),\n            tone: sum.edge > 0 ? OK : RED,\n            note: sum.edge > 0 ? 'points of error saved against a flat 2.2 home edge' : 'points WORSE than a flat home edge' },\n          { k: 'Bias', v: (sum.bias > 0 ? '+' : '') + sum.bias.toFixed(2), tone: Math.abs(sum.bias) < 0.6 ? OK : '#8a6d0b',\n            note: sum.bias > 0 ? 'favours home teams too much' : 'favours away teams too much' },\n          { k: 'Within 3', v: sum.within3.toFixed(0) + '%', tone: '#12201a', note: 'of the real margin' },\n          { k: 'Within 7', v: sum.within7.toFixed(0) + '%', tone: '#12201a', note: 'of the real margin' },\n          { k: 'Brier score', v: sum.brier == null ? '\\u2014' : sum.brier.toFixed(3),\n            tone: sum.brier != null && sum.brier < 0.24 ? OK : '#8a6d0b',\n            note: 'coin flip is 0.250 \\u00b7 lower is better' },\n          { k: 'Log loss', v: sum.logloss == null ? '\\u2014' : sum.logloss.toFixed(3),\n            tone: sum.logloss != null && sum.logloss < 0.68 ? OK : '#8a6d0b',\n            note: 'coin flip is 0.693 \\u00b7 punishes confident misses' }\n        ];\n\n        // Baselines, all on the same games.\n        const bl = sum.baselines || [];\n        const bestMae = Math.min.apply(null, bl.map(b => b.mae));\n        v.btBase = bl.map(b => ({\n          label: b.label, note: b.note,\n          mae: b.mae.toFixed(2),\n          acc: b.accuracy == null ? '\\u2014' : b.accuracy.toFixed(1) + '%',\n          brier: b.brier == null ? '\\u2014' : b.brier.toFixed(3),\n          ll: b.logloss == null ? '\\u2014' : b.logloss.toFixed(3),\n          row: 'display:grid;grid-template-columns:1fr 62px 66px 60px 56px;gap:10px;align-items:center;padding:10px 15px;border-bottom:1px solid #f3f4f0;'\n            + (b.self ? 'background:#f2f6f1;' : '')\n            + (Math.abs(b.mae - bestMae) < 1e-9 ? 'font-weight:600' : '')\n        }));\n        v.btBaseNote = 'A fourth row belongs here \\u2014 the closing line \\u2014 and cannot be built. '\n          + 'No free feed carries historical closing numbers, so the model has never been graded against the only opponent that matters.';\n        v.btBuckets = sum.buckets.filter(b => b.n > 0).map(b => ({\n          range: b.lo + '\\u2013' + (b.hi === 100 ? '100' : b.hi) + '%',\n          claimBar: 'position:absolute;left:0;top:0;bottom:50%;width:' + b.claimed.toFixed(1) + '%;background:#c9cfc8',\n          actualBar: 'position:absolute;left:0;top:50%;bottom:0;width:' + b.actual.toFixed(1) + '%;background:#0b3d26',\n          label: b.claimed.toFixed(0) + '% \\u2192 ' + b.actual.toFixed(0) + '% \\u00b7 n=' + b.n\n        }));\n        v.btWorst = sum.worst.map(r => ({\n          game: r.away + ' at ' + r.home,\n          detail: 'week ' + r.week + ' \\u00b7 said ' + (r.proj > 0 ? '+' : '') + r.proj.toFixed(1)\n            + ', was ' + (r.actual > 0 ? '+' : '') + r.actual,\n          err: Math.abs(r.err).toFixed(0) + ' off'\n        }));\n        const cal = sum.buckets.filter(b => b.n >= 12);\n        const worstCal = cal.reduce((w, b) =>\n          Math.abs(b.claimed - b.actual) > (w ? Math.abs(w.claimed - w.actual) : 0) ? b : w, null);\n        v.btVerdict = (sum.edge > 0\n          ? 'The factor model beats a flat home-field baseline by ' + sum.edge.toFixed(2) + ' points of average error, so the complexity is paying for itself. '\n          : 'The factor model is not beating a flat 2.2-point home edge. That means the factors are adding noise, not signal \\u2014 worth turning weights down before trusting it. ')\n          + (worstCal && Math.abs(worstCal.claimed - worstCal.actual) > 8\n            ? 'Confidence is off in the ' + worstCal.lo + '\\u2013' + worstCal.hi + '% band: it claims '\n              + worstCal.claimed.toFixed(0) + '% and lands ' + worstCal.actual.toFixed(0) + '%.'\n            : 'Stated confidence is tracking results within a few points across bands.');\n      } else {\n        v.btCards = []; v.btBuckets = []; v.btWorst = []; v.btBase = []; v.btBaseNote = '';\n        v.btVerdict = 'Nothing graded yet.';\n      }\n\n      // ---- factor overlap ----\n      // Two factors that move together are one factor charged twice. Turnover\n      // luck and efficiency are the pair most likely to overlap, because a team\n      // that has been recovering fumbles all year looks efficient for the same\n      // reason it looks lucky. This correlates every factor's per-game\n      // contribution across the current slate and reports the pairs that are\n      // effectively duplicating each other.\n      //\n      // The sample is one slate, because efficiency and turnover luck come from\n      // a snapshot describing today and cannot be reconstructed for past weeks.\n      // Sixteen games is enough to catch a factor that is a near-copy of\n      // another, and nowhere near enough to rule out a mild one.\n      const ovGames = this.slateGames() || [];\n      const series = {};\n      const ovKeys = (this.M.FACTORS || []).map(f => f.key);\n      const ovLabels = {};\n      (this.M.FACTORS || []).forEach(f => { ovLabels[f.key] = f.label; });\n      ovGames.forEach(g => {\n        let sm = null;\n        try { sm = this.sim(g); } catch (e) { return; }\n        if (!sm || !sm.contrib) return;\n        ovKeys.forEach(k => {\n          (series[k] = series[k] || []).push(sm.contrib[k] || 0);\n        });\n      });\n      const varies = ovKeys.filter(k => {\n        const a = series[k] || [];\n        return a.length > 3 && Math.max.apply(null, a) - Math.min.apply(null, a) > 1e-6;\n      });\n      const corr = (a, b) => {\n        const n = a.length;\n        const ma = a.reduce((x, y) => x + y, 0) / n, mb = b.reduce((x, y) => x + y, 0)
