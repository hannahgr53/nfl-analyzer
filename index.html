document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"7b7a4f23-7e96-4a4b-a8e7-92d5f734c439\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<noscript>\n  <div style=\"min-height:100vh;background:#f4f1ea;color:#12201a;font-family:'Helvetica Neue',Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px\">\n    <div style=\"max-width:34em\">\n      <div style=\"font-family:Georgia,serif;font-size:26px;font-weight:700;color:#0b3d26;line-height:1.25\">This page needs JavaScript to run.<\u002Fdiv>\n      <div style=\"height:4px;background:#d4a017;width:64px;margin:14px 0 18px\"><\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.65;text-wrap:pretty\">You are almost certainly seeing this because the file was opened in a preview pane rather than in a browser. Attachment previews in Mail and Messages, and Quick Look in the Files app, display the page but do not run it.<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.65;margin-top:14px;text-wrap:pretty\">Tap the share icon, choose <strong>Open in Safari<\u002Fstrong> (or Chrome), and the tool will load. Nothing is wrong with the file — there is no need to download it again.<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.6;margin-top:18px;color:#4a564d;text-wrap:pretty\">It also needs a data connection, because it pulls live scores, lines and injury reports each time it opens.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnoscript>\n<x-dc>\n<helmet>\n<script src=\"d513f966-6d8f-4cbe-a284-07145f196ca9\"><\u002Fscript>\n<script src=\"90f12ab5-1ae1-4fff-ad38-b700a160c96f\"><\u002Fscript>\n<script src=\"492f9a0c-9911-4d62-b291-738fc4867fa7\"><\u002Fscript>\n<script src=\"1faa4127-86c2-47b6-91fc-4c98892a32f4\"><\u002Fscript>\n<style>\n  body { margin:0; background:#f4f1ea; color:#12201a; font-family:'Helvetica Neue',Arial,sans-serif; }\n  a { color:#8b1e2b; text-decoration:none; }\n  a:hover { color:#d4a017; }\n  input[type=range] { accent-color:#0b3d26; }\n  ::-webkit-scrollbar { height:9px; width:9px; }\n  ::-webkit-scrollbar-thumb { background:#cfd4cd; border-radius:5px; }\n  @media (max-width: 820px) {\n    [data-shell] { grid-template-columns: minmax(0,1fr) !important; }\n    [data-gt] { grid-template-columns: minmax(0,1fr) 50px 50px 50px 44px !important; font-size:11.5px !important; }\n    [data-pair] { grid-template-columns: minmax(0,1fr) !important; }\n    [data-tabs] { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }\n    [data-tabs]::-webkit-scrollbar { display:none; }\n    [data-tabs] > div { white-space:nowrap; }\n    [data-pad] { padding-left:14px !important; padding-right:14px !important; }\n  }\n  /* ---------------------------- phone layer ----------------------------\n     Everything below only fires on a handset. The desktop layout is left\n     exactly as it was; this narrows the tables that can narrow, drops the\n     one column a phone has no room for, lets the genuinely wide tables\n     scroll sideways instead of crushing, and grows every tap target to\n     44px so the thing is usable with a thumb. */\n  @media (max-width: 620px) {\n    html { -webkit-text-size-adjust:100%; }\n    [data-pad] { padding:14px 12px 90px !important; }\n\n    /* header: title shrinks, controls become a full-width row of buttons */\n    [data-hdr] { padding:14px 12px 0 !important; }\n    [data-title] { font-size:22px !important; }\n    [data-sub] { display:none !important; }\n    [data-ctl] { width:100%; gap:7px !important; }\n    /* Refresh is a plain div, so it can be a centred flex box. The week\n       <sc-raw-select> must NOT be: display:flex on a select makes the native widget\n       ignore min-height entirely (it computed 18px), so it gets an explicit\n       height instead. */\n    [data-ctl] > div:last-child {\n      min-height:44px; display:flex; align-items:center; justify-content:center;\n    }\n    [data-ctl] > select {\n      flex:1 1 120px; font-size:15px !important;\n      height:44px !important; min-height:44px !important;\n    }\n    [data-ctl] > div:last-child { flex:1 1 90px; font-size:15px !important; }\n\n    /* tabs: thumb-sized, snap to each one */\n    [data-tabs] { gap:6px !important; margin-top:14px !important; scroll-snap-type:x proximity; }\n    [data-tabs] > div { min-height:44px; display:flex !important; align-items:center; scroll-snap-align:start; padding-left:15px !important; padding-right:15px !important; font-size:13.5px !important; }\n\n    /* slate table: drop the generator column, keep model / market / edge */\n    [data-gt] { grid-template-columns: minmax(0,1fr) 54px 54px 46px !important; font-size:11px !important; }\n    [data-gt] > *:nth-child(4) { display:none !important; }\n\n    /* Slate rows get a taller hit area. This is keyed to a data-row hook\n       rather than to \"cursor: pointer\", which also caught the compact chip\n       grids in Parlay and Sources and blew them up to 66px each.\n       NB: the runtime re-serializes inline styles with a space after each\n       colon, so the substring selectors further down must be written the way\n       the DOM prints them, not the way we authored them. Values inside a\n       declaration keep their spacing; \"minmax(0,1fr)\" does not (it becomes\n       \"minmax(0px, 1fr)\"), so never key off that fragment. */\n    [data-row] { min-height:52px; }\n\n    /* the deep dive stops trying to pin itself beside a column that is gone */\n    [data-shell] [style*=\"position: sticky\"] { position:static !important; top:auto !important; }\n\n    /* label / value / band rows: trim the numeric gutters rather than wrap */\n    [style*=\"74px 58px\"] { grid-template-columns: minmax(0,1fr) 62px 50px !important; }\n    [style*=\"1fr 62px 62px\"] { grid-template-columns: minmax(0,1fr) 54px 54px !important; }\n    /* Calibration buckets go to two lines: label and bar on top, the\n       claimed-vs-actual figures on their own line underneath. Hiding that\n       third cell would remove the only numbers in the readout. */\n    [style*=\"96px 1fr 130px\"] { grid-template-columns: 74px minmax(0,1fr) !important; row-gap:4px !important; }\n    [style*=\"96px 1fr 130px\"] > *:last-child {\n      grid-column:1 / -1 !important; text-align:left !important; font-size:11px !important;\n    }\n\n    /* six-column tables genuinely do not fit: let them scroll sideways */\n    div:has(> [style*=\"66px 66px 66px 62px\"]) { overflow-x:auto !important; -webkit-overflow-scrolling:touch; }\n    [style*=\"66px 66px 66px 62px\"] { min-width:560px; }\n\n    /* big scrolling data tables: shorter, so the page still scrolls past them */\n    [style*=\"max-height: 70vh\"], [style*=\"max-height: 74vh\"] { max-height:58vh !important; }\n    table { font-size:11.5px !important; }\n\n    /* Parlay on a phone: the ticket and the \"safest combo\" builder come first.\n       Collapsed to one column they were sitting under sixteen game cards, so\n       the size chips that build a parlay for you were effectively invisible. */\n    [data-parlay] { display:flex !important; flex-direction:column-reverse !important; align-items:stretch !important; }\n    /* the size and market chips in that panel are the primary control here */\n    [data-parlay] [style*=\"gap: 5px\"] > div { min-height:40px; display:flex; align-items:center; justify-content:center; padding-left:14px !important; padding-right:14px !important; }\n\n    /* controls in the fantasy / browse toolbars */\n    input[type=text], select { min-height:40px; font-size:15px !important; }\n    input[type=range] { width:100% !important; min-height:40px; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#f4f1ea\">\n\n  <div data-hdr=\"\" style=\"background:repeating-linear-gradient(180deg,#0b3d26,#0b3d26 38px,#0e4a2d 38px,#0e4a2d 76px);border-bottom:6px solid #d4a017;padding:20px 28px 0;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff1c 0 1px,transparent 1px 120px);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1500px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap\">\n      <div>\n        <div data-title=\"\" style=\"font-family:Georgia,serif;font-size:29px;font-weight:700;color:#f4f1ea\">NFL Analyzer<\u002Fdiv>\n        <div data-sub=\"\" style=\"font-size:12.5px;color:#f4f1eabb;margin-top:3px\">Simulation, market and your generator — side by side.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-ctl=\"\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <div style=\"{{ phaseChipStyle }}\">{{ phaseChip }}<\u002Fdiv>\n        <div style=\"{{ liveChipStyle }}\">{{ liveChip }}<\u002Fdiv>\n        <div title=\"No backtest here has ever compared the model to a closing line, because no free feed carries historical closing numbers. Until that comparison exists, treat every number in this tool as research, not as a reason to bet.\" style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 11px;border-radius:4px;background:#8b1e2b;color:#f4f1ea;border:1px solid #b0303f\">No demonstrated edge<\u002Fdiv>\n        <sc-raw-select sc-camel-on-change=\"{{ onWeek }}\" value=\"{{ weekKey }}\" style=\"font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid #ffffff44;border-radius:4px;background:#ffffff1a;color:#f4f1ea\">\n          <sc-for list=\"{{ weekOptions }}\" as=\"w\" hint-placeholder-count=\"3\">\n            <option value=\"{{ w.v }}\" style=\"color:#12201a\">{{ w.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <div sc-camel-on-click=\"{{ refresh }}\" style=\"cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:4px;background:#d4a017;color:#12201a\">Refresh<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-tabs=\"\" style=\"position:relative;display:flex;gap:4px;margin-top:16px;max-width:1500px;margin-left:auto;margin-right:auto\">\n      <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ v.go }}\" style=\"{{ v.style }}\">{{ v.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasUpdate }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ doUpdate }}\" style=\"cursor:pointer;background:#d4a017;color:#12201a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:13px;font-weight:700\">\n      <span>A newer version is on the server.<\u002Fspan>\n      <span style=\"flex:0 0 auto;background:#12201a;color:#f4f1ea;padding:7px 13px;border-radius:4px\">Update now<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div data-pad=\"\" style=\"max-width:1500px;margin:0 auto;padding:20px 28px 70px\">\n\n    <sc-if value=\"{{ bootMsg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"{{ bootStyle }}\">\n        <div style=\"font-family:Georgia,serif;font-size:16px;line-height:1.4;text-wrap:pretty\">{{ bootMsg }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#4a564d;line-height:1.65;margin-top:8px;text-wrap:pretty\">{{ bootHint }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#8a938c;line-height:1.5;margin-top:9px;font-family:ui-monospace,Menlo,monospace;word-break:break-all\">{{ bootDetail }}<\u002Fdiv>\n        <sc-if value=\"{{ busyOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px\">\n            <div style=\"height:10px;background:#f1f2ee;border:1px solid #e3e6e1;border-radius:5px;overflow:hidden\">\n              <div style=\"{{ busyBar }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:#4a564d;margin-top:7px;font-variant-numeric:tabular-nums\">\n              <span>{{ busyCount }}<\u002Fspan>\n              <span>{{ busyElapsed }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ GAMES ============================ -->\n    <sc-if value=\"{{ isGames }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-shell=\"\" style=\"display:block\">\n\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px\">\n            <div style=\"font-family:Georgia,serif;font-size:18px\">{{ slateTitle }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#6b746e\">{{ slateSub }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasTrouble }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #e4c9cd;border-left:4px solid #8b1e2b;border-radius:6px;padding:16px 18px;margin-bottom:14px\">\n              <div style=\"font-family:Georgia,serif;font-size:15px;color:#8b1e2b\">{{ troubleTitle }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#4a564d;line-height:1.65;margin:6px 0 12px;text-wrap:pretty\">{{ troubleBody }}<\u002Fdiv>\n              <sc-for list=\"{{ troubleRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div style=\"padding:6px 0;border-top:1px solid #f5f6f2\">\n                  <div style=\"font-size:12px;font-weight:700\">{{ r.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#8a938c;line-height:1.5\">{{ r.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden\">\n            <div data-gt=\"\" style=\"display:grid;grid-template-columns:1fr 76px 76px 76px 62px;gap:0;padding:8px 12px;background:#f6f4ee;border-bottom:1px solid #dfe3df;font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:#6b746e;font-weight:700\">\n              <div>Game<\u002Fdiv><div style=\"text-align:right\">Model<\u002Fdiv><div style=\"text-align:right\">Market<\u002Fdiv><div style=\"text-align:right\">Margin<\u002Fdiv><div style=\"text-align:right\">Edge<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ slate }}\" as=\"g\" hint-placeholder-count=\"16\">\n              <div data-row=\"\" sc-camel-on-click=\"{{ g.go }}\" sc-camel-on-touch-start=\"{{ rowTouchStart }}\" sc-camel-on-touch-move=\"{{ rowTouchMove }}\" sc-camel-on-touch-end=\"{{ g.go }}\" style=\"{{ g.rowStyle }}\">\n                <div data-gt=\"\" style=\"display:grid;grid-template-columns:1fr 76px 76px 76px 62px;align-items:center\">\n                  <div>\n                    <div style=\"display:flex;align-items:center;gap:6px\">\n                      <div style=\"font-family:Georgia,serif;font-size:14.5px;font-weight:700\">{{ g.title }}<\u002Fdiv>\n                      <sc-if value=\"{{ g.isDiv }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:9.5px;font-weight:700;letter-spacing:0.04em;padding:1px 5px;border-radius:3px;background:#0b3d26;color:#f4f1ea\">D<\u002Fspan>\n                      <\u002Fsc-if>\n                      <span style=\"{{ g.confStyle }}\">{{ g.conf }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px;color:#6b746e;margin-top:2px\">{{ g.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right\"><div style=\"font-size:15px;font-weight:700;font-variant-numeric:tabular-nums\">{{ g.modelPct }}<\u002Fdiv><div style=\"font-size:10px;color:#6b746e\">{{ g.modelPick }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"text-align:right\"><div style=\"font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#4a564d\">{{ g.marketPct }}<\u002Fdiv><div style=\"font-size:10px;color:#6b746e\">{{ g.marketPick }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"text-align:right\"><div style=\"font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#4a564d\">{{ g.genPct }}<\u002Fdiv><div style=\"font-size:10px;color:#6b746e\">{{ g.genPick }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"text-align:right\"><span style=\"{{ g.edgeStyle }}\">{{ g.edge }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;margin-top:9px;line-height:1.6\">Edge is the model's win probability minus the market's, on the model's pick. Large gaps mean the model sees something the price doesn't — or that the model is wrong. Tap any game to open its full breakdown; the X closes it.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- deep dive: opens over the page, closed with the X -->\n        <sc-if value=\"{{ hasPick }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ closePick }}\" style=\"position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(11,61,38,0.55);z-index:60\"><\u002Fdiv>\n          <div data-detail=\"\" style=\"position:fixed;top:0;right:0;bottom:0;left:0;z-index:61;display:flex;flex-direction:column;align-items:center\">\n            <div style=\"width:100%;max-width:580px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#f4f1ea;box-shadow:0 0 44px rgba(11,61,38,0.35)\">\n              <div style=\"flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0b3d26;color:#f4f1ea;padding:11px 12px\">\n                <div style=\"font-family:Georgia,serif;font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ddTitle }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ closePick }}\" style=\"flex:0 0 auto;width:36px;height:36px;border-radius:18px;background:rgba(244,241,234,0.16);font-size:20px;line-height:35px;text-align:center;cursor:pointer;font-weight:700\">×<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:12px 12px 34px\">\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n              <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6\">{{ dd.meta }}<\u002Fdiv>\n\n              <div style=\"{{ dd.confBox }}\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n                  <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#4a564d;font-weight:700\">Model confidence<\u002Fdiv>\n                  <div style=\"font-family:Georgia,serif;font-size:15px;font-weight:700\">{{ dd.confLevel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#4a564d;line-height:1.6;margin-top:6px;text-wrap:pretty\">{{ dd.confNote }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:3px;margin-top:8px\">\n                  <sc-for list=\"{{ dd.confReasons }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ r.style }}\">{{ r.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px\">\n                <sc-for list=\"{{ dd.sides }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <div style=\"{{ s.box }}\">\n                    <div style=\"font-family:Georgia,serif;font-size:15px;font-weight:700\">{{ s.team }}<\u002Fdiv>\n                    <div style=\"font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15\">{{ s.pct }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#6b746e;line-height:1.6;margin-top:3px\">{{ s.detail }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:16px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#6b746e;font-weight:700\">Score distribution — {{ dd.trialsLabel }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:1px;height:78px;margin-top:8px\">\n                <sc-for list=\"{{ dd.bins }}\" as=\"b\" hint-placeholder-count=\"24\">\n                  <div title=\"{{ b.tip }}\" style=\"{{ b.style }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#8a938c;margin-top:3px\">\n                <span>{{ dd.awayLabel }} by 35<\u002Fspan><span>even<\u002Fspan><span>{{ dd.homeLabel }} by 35<\u002Fspan>\n              <\u002Fdiv>\n\n              <div data-pair=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:16px\">\n                <sc-for list=\"{{ dd.stats }}\" as=\"s\" hint-placeholder-count=\"8\">\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid #f1f2ee;padding-bottom:5px\">\n                    <span style=\"color:#6b746e\">{{ s.k }}<\u002Fspan><span style=\"font-weight:700;font-variant-numeric:tabular-nums\">{{ s.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:16px;display:flex;align-items:center;gap:8px\">\n                <span style=\"font-size:11.5px;color:#6b746e\">Over/under line<\u002Fspan>\n                <input type=\"number\" step=\"0.5\" value=\"{{ ouLine }}\" sc-camel-on-change=\"{{ onOuLine }}\" style=\"font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:5px 7px;border:1px solid #dfe3df;border-radius:4px;width:72px\">\n                <span style=\"font-size:12.5px;font-weight:700\">{{ ouResult }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n              <div style=\"font-family:Georgia,serif;font-size:15px\">Why the model lands there<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin:4px 0 12px\">Base rates come from real scoring results. Each factor below shifts the margin by the points shown; \"flips\" is how often removing that factor alone would have changed the winner across all trials.<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;padding-bottom:6px;border-bottom:1px solid #dfe3df;font-weight:700\">\n                <span>Base expected score<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ dd.baseLine }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ dd.waterfall }}\" as=\"f\" hint-placeholder-count=\"13\">\n                <div style=\"display:grid;grid-template-columns:1fr 74px 58px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f5f6f2\">\n                  <span style=\"font-size:12px\">{{ f.label }}<\u002Fspan>\n                  <span style=\"{{ f.valStyle }}\">{{ f.val }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#8a938c;text-align:right\">{{ f.flip }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ dd.hasGen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:1fr 74px 58px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f5f6f2\">\n                  <span style=\"font-size:12px;color:#3d5a8a\">{{ dd.genLabel }}<\u002Fspan>\n                  <span style=\"{{ dd.genValStyle }}\">{{ dd.genVal }}<\u002Fspan>\n                  <span><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dd.hasShrink }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:1fr 74px 58px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f5f6f2\">\n                  <span style=\"font-size:12px;color:#6b746e\">{{ dd.shrinkLabel }}<\u002Fspan>\n                  <span style=\"{{ dd.shrinkValStyle }}\">{{ dd.shrinkVal }}<\u002Fspan>\n                  <span><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dd.hasAnchor }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:1fr 74px 58px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f5f6f2\">\n                  <span style=\"font-size:12px;color:#8a6d0b\">{{ dd.anchorLabel }}<\u002Fspan>\n                  <span style=\"{{ dd.anchorValStyle }}\">{{ dd.anchorVal }}<\u002Fspan>\n                  <span><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;justify-content:space-between;font-size:12.5px;padding-top:8px;font-weight:700\">\n                <span>Adjusted expected score<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ dd.adjLine }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#4a564d;line-height:1.6;margin-top:9px;padding-top:9px;border-top:1px solid #f1f2ee\">{{ dd.marginCompare }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ dd.hasInj }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Live injury report<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin:4px 0 12px\">From ESPN, updated through the day. Each name shows the points of margin it takes off, after depth-chart rank and the per-position ceiling.<\u002Fdiv>\n                <div data-pair=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n                  <sc-for list=\"{{ dd.injCols }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div>\n                      <div style=\"font-size:12.5px;font-weight:700\">{{ c.team }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#6b746e;margin:2px 0 8px\">{{ c.head }}<\u002Fdiv>\n                      <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                        <div style=\"display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:baseline;padding:5px 0;border-top:1px solid #f5f6f2\">\n                          <div>\n                            <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n                              <span style=\"font-size:12px\">{{ r.name }}<\u002Fspan>\n                              <span style=\"{{ r.depthStyle }}\">{{ r.depthLabel }}<\u002Fspan>\n                            <\u002Fdiv>\n                            <div style=\"font-size:10.5px;color:#8a938c\">{{ r.meta }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <span style=\"font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:#8b1e2b\">{{ r.cost }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <div style=\"font-size:11px;color:#8a938c;padding-top:5px\">{{ c.empty }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#4a564d;line-height:1.6;margin-top:11px;padding-top:9px;border-top:1px solid #f1f2ee\">{{ dd.injFoot }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ dd.matchupPending }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Positional matchup<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8a938c;line-height:1.6;margin-top:4px\">Loading depth charts and team statistics… the model will re-run with the matchup factor once they arrive.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ dd.hasMatchup }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Positional matchup<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin:4px 0 12px\">{{ dd.matchupNote }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 62px 62px;gap:8px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid #eceee8\">\n                  <span><\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;text-align:right;color:#6b746e\">{{ dd.away }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;text-align:right;color:#6b746e\">{{ dd.home }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ dd.matchupRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:1fr 62px 62px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f5f6f2\">\n                    <span style=\"font-size:12px\">{{ r.label }}<\u002Fspan>\n                    <span style=\"{{ r.awayStyle }}\">{{ r.awayVal }}<\u002Fspan>\n                    <span style=\"{{ r.homeStyle }}\">{{ r.homeVal }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:11px;padding-top:9px;border-top:1px solid #f1f2ee\">\n                  <sc-for list=\"{{ dd.matchupRead }}\" as=\"line\" hint-placeholder-count=\"2\">\n                    <div style=\"font-size:11.5px;color:#4a564d;line-height:1.6;text-wrap:pretty\">{{ line }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ dd.hasGreen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n                <div style=\"font-family:Georgia,serif;font-size:15px\">Lineup experience<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin:4px 0 12px\">{{ dd.greenNote }}<\u002Fdiv>\n                <div data-pair=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n                  <sc-for list=\"{{ dd.greenCols }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div>\n                      <div style=\"font-size:12.5px;font-weight:700\">{{ c.team }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#6b746e;margin:2px 0 2px\">{{ c.head }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#8a6d0b;margin-bottom:7px\">{{ c.swing }}<\u002Fdiv>\n                      <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                        <div style=\"padding:4px 0;border-top:1px solid #f5f6f2\">\n                          <div style=\"font-size:12px\">{{ r.name }}<\u002Fdiv>\n                          <div style=\"font-size:10.5px;color:#8a938c\">{{ r.meta }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ dd.hasNews }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n                <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:10px\">Latest on these teams<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column\">\n                  <sc-for list=\"{{ dd.news }}\" as=\"n\" hint-placeholder-count=\"4\">\n                    <a href=\"{{ n.link }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;padding:7px 0;border-top:1px solid #f5f6f2;text-decoration:none;color:inherit\" style-hover=\"background:#fafbf8\">\n                      <div style=\"font-size:12px;line-height:1.45;text-wrap:pretty\">{{ n.headline }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:#8a938c;margin-top:2px\">{{ n.meta }}<\u002Fdiv>\n                    <\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ PARLAY ============================ -->\n    <sc-if value=\"{{ isParlay }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-shell=\"\" data-parlay=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px\">\n            <div style=\"font-family:Georgia,serif;font-size:18px\">Pick winners<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"font-size:11.5px;color:#6b746e\">Odds from<\u002Fspan>\n              <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px\">\n            <sc-for list=\"{{ parlayGames }}\" as=\"g\" hint-placeholder-count=\"16\">\n              <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#f6f4ee;border-bottom:1px solid #eceee9\">\n                  <div style=\"font-family:Georgia,serif;font-size:13.5px;font-weight:700\">{{ g.title }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#6b746e;white-space:nowrap\">{{ g.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:9px 11px;display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ g.groups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n                    <div>\n                      <div style=\"font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:5px\">{{ grp.label }}<\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\">\n                        <sc-for list=\"{{ grp.legs }}\" as=\"l\" hint-placeholder-count=\"2\">\n                          <div sc-camel-on-click=\"{{ l.go }}\" style=\"{{ l.style }}\">\n                            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:6px\">\n                              <span style=\"font-size:12px;font-weight:700\">{{ l.label }}<\u002Fspan>\n                              <span style=\"font-size:14px;font-weight:700;font-variant-numeric:tabular-nums\">{{ l.pct }}<\u002Fspan>\n                            <\u002Fdiv>\n                            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:3px\">\n                              <span style=\"font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:#6b746e\">fair odds<\u002Fspan>\n                              <span style=\"font-size:11.5px;font-weight:700;color:#8b1e2b;font-variant-numeric:tabular-nums\">{{ l.am }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:sticky;top:14px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#0b3d26;color:#f4f1ea;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:#d4a017;font-weight:700\">{{ comboLabel }}<\u002Fdiv>\n            <div style=\"font-family:Georgia,serif;font-size:42px;font-weight:700;line-height:1.05;margin:7px 0 2px;font-variant-numeric:tabular-nums\">{{ comboPct }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#f4f1eabb;line-height:1.55\">{{ comboSub }}<\u002Fdiv>\n            <sc-if value=\"{{ hasPush }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:11px;padding:10px 12px;background:#0e4a2d;border-left:3px solid #f4f1ea66;border-radius:4px;font-size:11.5px;line-height:1.6;text-wrap:pretty\">{{ pushText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasCorr }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:11px;padding:10px 12px;background:#0e4a2d;border-left:3px solid #d4a017;border-radius:4px;font-size:11.5px;line-height:1.6;text-wrap:pretty\">{{ corrText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ pickList }}\" as=\"p\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11.5px;border-top:1px solid #ffffff1f;padding-top:6px\">\n                  <span>{{ p.label }}<\u002Fspan><span style=\"{{ p.pctStyle }}\">{{ p.pct }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasWeak }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:12px;padding:10px 12px;background:#8b1e2b;border-radius:4px;font-size:11.5px;line-height:1.55\"><b>Weakest link:<\u002Fb> {{ weakText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasFairOdds }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px;font-size:11.5px;color:#f4f1eabb;line-height:1.55\">Fair payout at these odds: <b style=\"color:#f4f1ea\">{{ fairOdds }}<\u002Fb>. Anything less is the house's margin.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ saveTicket }}\" style=\"{{ saveTicketStyle }}\">{{ saveTicketLabel }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ clearPicks }}\" style=\"font-size:11.5px;color:#f4f1ea99;cursor:pointer;text-decoration:underline\">Clear all picks<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:3px\">Safest combo<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin-bottom:11px\">Highest-probability parlay available at each size. All markets mixes moneyline, spread and total.<\u002Fdiv>\n            <div style=\"display:flex;gap:5px;margin-bottom:8px\">\n              <sc-for list=\"{{ comboMarkets }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ m.go }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:5px;margin-bottom:11px\">\n              <sc-for list=\"{{ comboSizes }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.n }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family:Georgia,serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums\">{{ safePct }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b746e;line-height:1.6;margin-top:5px\">{{ safeTeams }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ applySafe }}\" style=\"margin-top:11px;display:inline-block;background:#0b3d26;color:#f4f1ea;font-size:11.5px;font-weight:600;padding:8px 13px;border-radius:4px;cursor:pointer\">Load this parlay<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasBestEdge }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #d4a017;border-radius:6px;padding:16px 18px\">\n              <div style=\"font-family:Georgia,serif;font-size:15px;margin-bottom:3px\">Biggest disagreements<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin-bottom:10px\">Where the model is furthest from the market.<\u002Fdiv>\n              <sc-for list=\"{{ bestEdges }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 0;border-top:1px solid #f1f2ee\">\n                  <span>{{ e.label }}<\u002Fspan><span style=\"font-weight:700;color:#8b1e2b;font-variant-numeric:tabular-nums\">{{ e.edge }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ LINE MOVES ============================ -->\n    <sc-if value=\"{{ isClv }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1000px\">\n        <div style=\"font-family:Georgia,serif;font-size:18px;margin-bottom:4px\">Line moves and closing line value<\u002Fdiv>\n        <div style=\"font-size:12px;color:#4a564d;line-height:1.7;margin-bottom:14px;text-wrap:pretty\">{{ clvIntro }}<\u002Fdiv>\n\n        <sc-if value=\"{{ hasClvStats }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#0b3d26;color:#f4f1ea;border-radius:6px;padding:16px 18px;margin-bottom:14px;display:flex;gap:26px;flex-wrap:wrap\">\n            <sc-for list=\"{{ clvStats }}\" as=\"st\" hint-placeholder-count=\"5\">\n              <div>\n                <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#d4a017;font-weight:700\">{{ st.k }}<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums\">{{ st.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasClv }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;overflow:hidden\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 66px 66px 66px 62px 62px;gap:8px;padding:8px 14px;background:#f6f4ee;border-bottom:1px solid #dfe3df;font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:#6b746e;font-weight:700\">\n              <div>Game<\u002Fdiv>\n              <div style=\"text-align:right\">Model<\u002Fdiv>\n              <div style=\"text-align:right\">Opened<\u002Fdiv>\n              <div style=\"text-align:right\">Latest<\u002Fdiv>\n              <div style=\"text-align:right\">Move<\u002Fdiv>\n              <div style=\"text-align:right\">CLV<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ clvList }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 66px 66px 66px 62px 62px;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #f1f2ee\">\n                <div>\n                  <div style=\"font-family:Georgia,serif;font-size:13.5px;font-weight:700\">{{ r.title }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#6b746e;margin-top:2px\">{{ r.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ r.model }}<\u002Fdiv>\n                <div style=\"text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:#6b746e\">{{ r.opened }}<\u002Fdiv>\n                <div style=\"text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:#6b746e\">{{ r.closed }}<\u002Fdiv>\n                <div style=\"text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:#6b746e\">{{ r.moveLabel }}<\u002Fdiv>\n                <div style=\"{{ r.clvStyle }}\">{{ r.clv }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;margin-top:9px;line-height:1.65;text-wrap:pretty\">All numbers are home-team margins: positive means the home side. Move is how the market shifted between first and latest sample; CLV is that move signed toward whichever side the model was on when it was first written down.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noClv }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border:1px solid #dfe3df;border-left:4px solid #d4a017;border-radius:6px;padding:18px 20px;font-size:12px;color:#4a564d;line-height:1.7;max-width:620px;text-wrap:pretty\">{{ clvEmpty }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ FANTASY ============================ -->\n    <sc-if value=\"{{ isFantasy }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;gap:16px;flex-wrap:wrap\">\n          <div style=\"font-family:Georgia,serif;font-size:18px\">Fantasy projections<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b746e\">{{ fpCountLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0b3d26;color:#f4f1ea;border-radius:6px;padding:15px 17px;margin-bottom:12px\">\n          <div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#d4a017;font-weight:700;margin-bottom:6px\">Projections from<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ fpSrcPills }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#d4a017;font-weight:700;margin-bottom:6px\">Scoring<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ fpScoringPills }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#f4f1eacc;line-height:1.6;margin-top:10px;text-wrap:pretty\">{{ fpSrcNote }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#f4f1ea99;line-height:1.6;margin-top:6px;text-wrap:pretty\">{{ fpUsageNote }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#f4f1eacc;line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid #ffffff1f;text-wrap:pretty\">{{ fpRecentNote }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#f4f1ea99;line-height:1.6;margin-top:6px;text-wrap:pretty\">{{ fpOppNote }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#f4f1ea99;line-height:1.6;margin-top:6px;text-wrap:pretty\">{{ fpDefKNote }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #d4a017;border-radius:6px;padding:15px 17px;margin-bottom:12px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n            <div style=\"font-family:Georgia,serif;font-size:16px\">Build a lineup<\u002Fdiv>\n            <div style=\"font-size:11px;color:#6b746e\">{{ lSelLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin:4px 0 10px;text-wrap:pretty\">{{ lRulesNote }}<\u002Fdiv>\n\n          <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Kickoff windows<\u002Fdiv>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px\">\n            <sc-for list=\"{{ lWindows }}\" as=\"w\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ w.go }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin-bottom:11px;text-wrap:pretty\">{{ lWindowNote }}<\u002Fdiv>\n\n          <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Games<\u002Fdiv>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px\">\n            <sc-for list=\"{{ lGames }}\" as=\"g\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ g.go }}\" style=\"{{ g.style }}\">{{ g.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Build for<\u002Fdiv>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n            <sc-for list=\"{{ lModes }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ m.go }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin-top:7px;text-wrap:pretty\">{{ lModeNote }}<\u002Fdiv>\n\n          <sc-if value=\"{{ lHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:13px;border-top:1px solid #f1f2ee;padding-top:12px\">\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ lRows }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px;background:#f8f7f2;border-radius:5px;padding:9px 11px\">\n                    <div style=\"font-family:Georgia,serif;font-size:15px;font-weight:700;color:#d4a017;min-width:16px\">{{ p.slot }}<\u002Fdiv>\n                    <div style=\"flex:1 1 auto;min-width:0\">\n                      <div style=\"font-size:13px;font-weight:700\">{{ p.player }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#6b746e;margin-top:2px\">{{ p.pos }} · {{ p.team }} · {{ p.spread }} <span style=\"color:#2e7d4f;font-weight:600\">{{ p.gain }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"display:flex;gap:12px;margin-top:4px;font-size:11px;color:#6b746e\">\n                        <span>boom <span style=\"{{ p.boomStyle }}\">{{ p.boom }}<\u002Fspan><\u002Fspan>\n                        <span>bust <span style=\"{{ p.bustStyle }}\">{{ p.bust }}<\u002Fspan><\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:Georgia,serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{ p.main }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:11px;padding-top:10px;border-top:1px solid #f1f2ee\">\n                <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">{{ lTotalLabel }}<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums\">{{ lTotal }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8b1e2b;line-height:1.55;margin-top:4px\">{{ lShort }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ lClear }}\" style=\"margin-top:9px;font-size:11.5px;color:#6b746e;cursor:pointer;text-decoration:underline\">Clear selected games<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ lNoGames }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:12px;border-top:1px solid #f1f2ee;padding-top:11px;font-size:12px;color:#6b746e;line-height:1.6;text-wrap:pretty\">{{ lEmpty }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #0b3d26;border-radius:6px;padding:15px 17px;margin-bottom:12px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n            <div style=\"font-family:Georgia,serif;font-size:16px\">Under the cap<\u002Fdiv>\n            <div style=\"font-size:11px;color:#6b746e\">{{ salCapLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin:4px 0 10px;text-wrap:pretty\">{{ salIntro }}<\u002Fdiv>\n\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:11px\">\n            <div>\n              <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Salary cap<\u002Fdiv>\n              <input type=\"text\" value=\"{{ salCap }}\" sc-camel-on-change=\"{{ onSalCap }}\" style=\"width:110px;box-sizing:border-box;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:7px 9px;border:1px solid #dfe3df;border-radius:4px;background:#fbfbf8;color:#12201a\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Book<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ salBooks }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ b.go }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Build for<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ salModes }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ m.go }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div sc-camel-on-click=\"{{ loadDk }}\" style=\"display:inline-block;font-size:11.5px;font-weight:600;padding:8px 14px;border-radius:4px;background:#0b3d26;color:#f4f1ea;cursor:pointer;margin-bottom:13px\">{{ dkLabel }}<\u002Fdiv>\n\n          <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Or paste a FanDuel list<\u002Fdiv>\n          <textarea sc-camel-on-change=\"{{ onSalText }}\" placeholder=\"Paste the FanDuel player list here — the whole CSV is fine\" style=\"width:100%;box-sizing:border-box;min-height:70px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;padding:9px 10px;border:1px solid #dfe3df;border-radius:4px;background:#fbfbf8;color:#12201a\"><\u002Ftextarea>\n          <div style=\"display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ applySal }}\" style=\"font-size:11.5px;font-weight:600;padding:8px 14px;border-radius:4px;background:#0b3d26;color:#f4f1ea;cursor:pointer\">Load salaries<\u002Fdiv>\n            <sc-if value=\"{{ hasSalaries }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ clearSal }}\" style=\"font-size:11.5px;color:#8b1e2b;cursor:pointer;text-decoration:underline\">Remove them<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"{{ salLoadStyle }}\">{{ salLoadNote }}<\u002Fdiv>\n\n          <sc-if value=\"{{ salHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:13px;border-top:1px solid #f1f2ee;padding-top:12px\">\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ salRows }}\" as=\"p\" hint-placeholder-count=\"9\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px;background:#f8f7f2;border-radius:5px;padding:9px 11px\">\n                    <div style=\"font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:#0b3d26;font-weight:700;min-width:34px\">{{ p.slot }}<\u002Fdiv>\n                    <div style=\"flex:1 1 auto;min-width:0\">\n                      <div style=\"font-size:13px;font-weight:700\">{{ p.player }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#6b746e;margin-top:2px\">{{ p.pos }} · {{ p.team }} · {{ p.salary }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:Georgia,serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{ p.main }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin-top:11px;padding-top:10px;border-top:1px solid #f1f2ee;align-items:baseline\">\n                <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700\">{{ salTotalLabel }}<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right\">{{ salTotal }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6b746e\">Salary used<\u002Fdiv>\n                <div style=\"font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right\">{{ salSpend }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6b746e;line-height:1.55;margin-top:7px;text-wrap:pretty\">{{ salFootnote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ salNoRows }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:12px;border-top:1px solid #f1f2ee;padding-top:11px;font-size:12px;color:#6b746e;line-height:1.6;text-wrap:pretty\">{{ salEmpty }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe3df;border-radius:6px;padding:13px 16px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px\">\n          <div style=\"flex:1 1 190px;min-width:0\">\n            <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Search player<\u002Fdiv>\n            <input type=\"text\" value=\"{{ fpQuery }}\" sc-camel-on-change=\"{{ onFpQuery }}\" placeholder=\"Name, team or position\" style=\"width:100%;box-sizing:border-box;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:7px 9px;border:1px solid #dfe3df;border-radius:4px;background:#fbfbf8;color:#12201a\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Position<\u002Fdiv>\n            <div style=\"display:flex;gap:4px\">\n              <sc-for list=\"{{ positions }}\" as=\"p\" hint-placeholder-count=\"7\">\n                <div sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:#6b746e;font-weight:700;margin-bottom:6px\">Team<\u002Fdiv>\n            <sc-raw-select sc-camel-on-change=\"{{ onTeam }}\" value=\"{{ teamFilter }}\" style=\"font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid #dfe3df;border-radius:4px;background:#fff;min-width:112px\">\n              <sc-for list=\"{{ teamOptions }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <option value=\"{{ t.v }}\">{{ t.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.09em;text-transfo
