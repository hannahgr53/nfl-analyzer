his.loadAll();\n    };\n    v.snapMsg = s.snapMsg || null;\n    v.snapMsgStyle = 'margin-top:9px;padding:9px 11px;border-radius:4px;font-size:11.5px;line-height:1.55;text-wrap:pretty;'\n      + (s.snapOk ? 'background:#f2f8f4;border:1px solid #cfe3d6;color:#2b4f39'\n        : 'background:#fbf2f3;border:1px solid #e4c9cd;color:#8b1e2b');\n\n    // ---------------- line moves ----------------\n    // The record starts the first time the app is opened and grows from there.\n    // Nothing here is retroactive, which is the point: a prediction only counts\n    // if it was written down before the line moved.\n    const cRows = this.L.clvRows ? this.L.clvRows() : [];\n    const cSum = this.L.clvSummary ? this.L.clvSummary(cRows) : { n: 0 };\n    v.hasClv = cRows.length > 0;\n    v.noClv = cRows.length === 0;\n    v.clvIntro = 'Every load stamps what the model said and what the market was offering. '\n      + 'Closing line value is how far the market moved toward the model\\u2019s side afterwards \\u2014 '\n      + 'the one measure of whether the model knew something before the price did, and it stays '\n      + 'meaningful whether or not the pick won.';\n    v.clvEmpty = 'Nothing logged yet. Numbers appear here once the app has seen a game more than once '\n      + 'and a line has moved \\u2014 usually a day or two after first load.';\n    v.clvStats = cSum.n\n      ? [{ k: 'Games with movement', v: String(cSum.n) },\n         { k: 'Average CLV', v: (cSum.avg > 0 ? '+' : '') + cSum.avg.toFixed(2) + ' pts' },\n         { k: 'Market moved our way', v: cSum.beat + ' of ' + cSum.n + ' \\u00b7 ' + cSum.beatPct.toFixed(0) + '%' },\n         { k: 'Best', v: cSum.best ? cSum.best.away + ' @ ' + cSum.best.home + '  ' + (cSum.best.clv > 0 ? '+' : '') + cSum.best.clv.toFixed(1) : '\\u2014' },\n         { k: 'Worst', v: cSum.worst ? cSum.worst.away + ' @ ' + cSum.worst.home + '  ' + (cSum.worst.clv > 0 ? '+' : '') + cSum.worst.clv.toFixed(1) : '\\u2014' }]\n      : [];\n    v.hasClvStats = !!cSum.n;\n    const sp = x => x == null ? '\\u2014' : (x > 0 ? '+' : '') + x.toFixed(1);\n    v.clvList = cRows.slice(0, 80).map(r => ({\n      title: r.away + ' @ ' + r.home,\n      sub: [r.season ? r.season + ' wk ' + r.week : null, r.samples + ' samples',\n        'first seen ' + new Date(r.firstAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })\n      ].filter(Boolean).join(' \\u00b7 '),\n      model: sp(r.model), opened: sp(r.opened), closed: sp(r.closed),\n      moveLabel: r.opened == null || r.closed == null ? '\\u2014'\n        : (r.closed - r.opened > 0 ? '+' : '') + (r.closed - r.opened).toFixed(1),\n      clv: r.clv == null ? '\\u2014' : (r.clv > 0 ? '+' : '') + r.clv.toFixed(1),\n      clvStyle: 'text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:'\n        + (r.clv == null ? DIM : r.clv > 0.01 ? OK : r.clv < -0.01 ? RED : DIM),\n      sideLabel: r.side == null ? '' : r.side === 'home' ? r.home : r.away\n    }));\n\n    const edges = slate.filter(g => g.market).map(g => {\n      const sm = this.sim(g);\n      const home = sm.homeWinPct >= 50;\n      const mp = home ? g.market.home : g.market.away;\n      return { team: home ? g.home : g.away, matchup: g.away + ' @ ' + g.home, e: Math.max(sm.homeWinPct, sm.awayWinPct) - mp };\n    }).sort((a, b) => Math.abs(b.e) - Math.abs(a.e)).slice(0, 4);\n    v.hasBestEdge = edges.length > 0;\n    v.bestEdges = edges.map(x => ({ label: x.team + ' \\u00b7 ' + x.matchup, edge: (x.e > 0 ? '+' : '') + x.e.toFixed(1) + ' pts' }));\n\n    // ---------------- fantasy ----------------\n    const fp = s.snap.tabs['Fantasy Projections'] || { columns: [], rows: [] };\n    const c = n => fp.columns.indexOf(n);\n    const isDef = s.pos === 'DEF';\n    const mapFp = () => this.fpAdjust(fp.rows.map(r => ({\n      player: r[c('Player')], pos: r[c('Pos')], team: r[c('Team')], opp: r[c('Opponent')],\n      proj: parseFloat(r[c('Projected')]), season: parseFloat(r[c('Season Avg')]),\n      l3: parseFloat(r[c('L3 Avg')]), trend: (r[c('Trend')] || '').replace(' trending', ''),\n      snap: r[c('Snap%')], tgt: r[c('Target Share%')], status: (r[c('Status')] || '').trim(),\n      div: r[c('Division Game')] === 'Yes'\n    })));\n    const posSet = s.pos === 'FLEX' ? ['RB', 'WR', 'TE'] : s.pos === 'ALL' ? null : [s.pos];\n    const defRank = {};\n    Object.values(s.teams).forEach(t => { defRank[t.team] = t.defRank; });\n\n    let base;\n    if (isDef) {\n      const d = s.snap.tabs['Team Defense (DST)'] || { columns: [], rows: [] };\n      const di = n => d.columns.indexOf(n);\n      base = d.rows.map(r => ({\n        player: r[di('Team')] + ' D/ST', pos: 'DEF', team: r[di('Team')], opp: '',\n        proj: parseFloat(r[di('Avg Fantasy Pts')]), season: parseFloat(r[di('Pts Allowed/Gm')]),\n        l3: parseFloat(r[di('Sacks')]), trend: r[di('INTs')] + ' INT \\u00b7 ' + r[di('Def/ST TDs')] + ' TD',\n        snap: null, tgt: null, status: '', div: false\n      }));\n    } else {\n      base = mapFp();\n    }\n    // -------------------------------------------------------------------\n    // Live projections. Rather than importing a per-player number, each\n    // team's simulated production is split across its players by the usage\n    // shares ESPN's own stats imply. Same simulation that prices the game,\n    // so a receiver's ceiling arrives in the games his team blows someone out.\n    // -------------------------------------------------------------------\n    const scoring = s.fpScoring || 'ppr';\n    const acc = this.U ? this.U.fpAccuracy(scoring) : { positions: [], bias: {}, n: 0, open: 0, corrected: [] };\n    const usageOk = !!(this.U && s.usage && s.usage.ok > 0);\n    let liveBase = null, liveTeams = 0, liveRecent = null, liveRecentUsed = 0, liveOppAdj = 0;\n    if (usageOk) {\n      const norm = n => String(n == null ? '' : n).toLowerCase()\n        .replace(/[.'\\u2019\\u2018-]/g, '').replace(/\\s+(jr|sr|ii|iii|iv|v)$/, '').trim();\n      // Designations, as a multiplier on the share a player keeps. Anyone at\n      // zero drops out and his work is redistributed by the usage layer.\n      const KEEP = { 'Out': 0, 'Injured Reserve': 0, 'Suspension': 0, 'Doubtful': 0.25, 'Questionable': 0.85 };\n      const tagOf = {};\n      liveBase = [];\n      // Last three weeks of usage, from the weekly rows the app has stored.\n      const recent = this.U.recentRates(s.season, s.week, 3);\n      v.fpRecent = recent;\n      liveRecent = recent;\n      slate.forEach(g => {\n        const sm = this.sim(g);\n        if (!sm) return;\n        [[g.home, true], [g.away, false]].forEach(([team, isHome]) => {\n          const rec = this.injFor(team);\n          const outNames = {};\n          if (rec && rec.rows) {\n            rec.rows.forEach(x => {\n              const k = KEEP[x.status];\n              if (k != null && k < 1) {\n                outNames[norm(x.name)] = k;\n                tagOf[team + '|' + norm(x.name)] = x.status;\n              }\n            });\n          }\n          const tu = this.U.teamUsage(s.usage, team, { outNames, recent });\n          if (!tu.hasData) return;\n          liveTeams++;\n          liveRecentUsed += tu.recentUsed || 0;\n          const rt = s.teams[team] || {};\n          const oppTeam = isHome ? g.away : g.home;\n          // The defense he is actually facing, in league z-scores, per phase.\n          const oppStr = this.strFor(oppTeam);\n          const teamPoints = isHome ? sm.expH : sm.expA;\n          const projected = this.U.projectTeam({\n            usage: tu, scoring, bias: acc.bias,\n            teamPoints, basePpg: rt.ppg, opp: oppStr\n          });\n          if (oppStr) liveOppAdj++;\n\n          // Kicker and defense, neither of which existed before.\n          const k = this.U.projectKicker({ usage: s.usage, team, teamPoints });\n          if (k) projected.push(k);\n          const d = this.U.projectDefense({\n            sim: sm, isHome, team, opp: imulated —\n    // simulating all sixteen to show twenty players is wasted work on first paint.\n    const enrich = list => {\n      const needTeams = {};\n      list.forEach(r => { needTeams[r.team] = true; });\n      const simByTeam = {};\n      slate.forEach(g => {\n        if (!needTeams[g.home] && !needTeams[g.away]) return;\n        const sm = this.sim(g);\n        if (!sm) return;\n        simByTeam[g.home] = { sim: sm, isHome: true, opp: g.away, gid: g.id };\n        simByTeam[g.away] = { sim: sm, isHome: false, opp: g.home, gid: g.id };\n      });\n      let corr = 0;\n      const out = list.map(r => {\n        const ctx = simByTeam[r.team];\n        const ck = r.player + '|' + r.proj + '|' + fpTrials + '|' + (ctx ? 'g' : 'x');\n        let sp = this.fpCache[ck];\n        if (!sp) {\n          const o = {\n            status: !!r.status, snap: r.snap == null ? null : +r.snap,\n            trendDown: (r.trend || '').indexOf('down') >= 0, trials: fpTrials, seed: this.hash(r.player)\n          };\n          sp = ctx\n            ? this.M.simPlayerInGame(r.proj, r.pos, ctx.sim, ctx.isHome, o)\n            : this.M.simPlayer(r.proj, r.pos, o);\n          this.fpCache[ck] = sp;\n        }\n        if (sp.correlated) corr++;\n        return Object.assign({}, r, sp, { gid: ctx ? ctx.gid : null });\n      });\n      return { rows: out, correlated: corr };\n    };\n    const enriched = enrich(rows);\n    rows = enriched.rows;\n    const correlated = enriched.correlated;\n    v.fpCorrNote = correlated\n      ? correlated + ' of ' + rows.length + ' players are drawn from their own game\\u2019s '\n        + fpTrials.toLocaleString() + ' simulations, so a ceiling arrives in the same games as the blowout that produces it.'\n        + (rows.length - correlated > 0\n          ? ' The other ' + (rows.length - correlated) + ' are not on this slate and fall back to standalone variance.'\n          : '')\n      : 'No players on this slate matched a modelled game, so these are standalone projections without game context.';\n\n    // Source and scoring controls.\n    v.fpSrcPills = [['live', 'Live model'], ['snapshot', 'Snapshot file']].map(([k, label]) =>\n      this.pill((s.fpSrc || 'live') === k, label, () => { this.fpCache = {}; set({ fpSrc: k }); }, '6px 11px'));\n    v.fpScoringPills = [['ppr', 'PPR'], ['half', 'Half PPR'], ['standard', 'Standard']].map(([k, label]) =>\n      this.pill(scoring === k, label, () => { this.fpCache = {}; set({ fpScoring: k }); }, '6px 11px'));\n    v.fpLiveOn = useLive;\n    v.fpSrcNote = useLive\n      ? 'Computed here, now. Each team\\u2019s simulated production is split across its players by the share of '\n        + 'passing, rushing and target volume ESPN\\u2019s season stats give them \\u2014 ' + liveTeams\n        + ' teams on this slate had enough usage data to price. Nothing on this screen comes from the snapshot file.'\n      : usageOk\n        ? 'Showing the snapshot file\\u2019s projections. Switch to the live model for projections computed from current usage.'\n        : 'The live model needs ESPN\\u2019s player stats, which did not load, so these are the snapshot file\\u2019s projections '\n          + 'and are only as current as the date below.';\n    v.fpRecentNote = !useLive ? ''\n      : liveRecent\n        ? 'Recent form is in: weeks ' + liveRecent.fromWeek + '\\u2013' + liveRecent.toWeek\n          + ' of usage carry extra weight for ' + liveRecentUsed + ' players, so a back who took the job three weeks ago '\n          + 'is priced on that job rather than on a season average that includes the games he sat.'\n        : 'Recent form is not available yet. The app stores each week\\u2019s totals when it opens, and once two weeks exist '\n          + 'the difference between them becomes last-three-weeks usage automatically. Season shares are being used until then.';\n    v.fpOppNote = useLive\n      ? 'Opponent strength is applied per phase, not per team: ' + liveOppAdj + ' of the ' + liveTeams\n        + ' offenses priced here were adjusted for the specific pass and rush defense they face, and volume tilts '\n        + 'slightly toward whichever side of that defense is softer.'\n      : '';\n    v.fpDefKNote = useLive\n      ? 'Kickers and defenses are projected here too. A defense\\u2019s points-allowed score is averaged across every '\n        + 'simulated game rather than read off one predicted total, because points allowed pays in brackets \\u2014 the '\n        + 'difference between 20 and 21 points is worth a full point of scoring.'\n      : '';\n    v.fpUsageNote = s.usage && s.usage.note\n      ? s.usage.note + (s.usage.cached ? ' \\u00b7 cached ' + this.ago(s.usage.ageMs) : ' \\u00b7 fetched just now')\n        + '. Roles blend the two seasons: at week 1 last season carries the weight, and by game five this season has taken over.'\n      : '';\n\n    // Accuracy, measured rather than claimed.\n    v.accHas = acc.n > 0;\n    v.accNone = acc.n === 0;\n    v.accN = String(acc.n);\n    v.accOpen = String(acc.open);\n    v.accMae = acc.n ? acc.mae.toFixed(1) : '\\u2014';\n    v.accBias = acc.n ? (acc.biasAll >= 0 ? '+' : '') + acc.biasAll.toFixed(1) : '\\u2014';\n    v.accRows = acc.positions.map(p => ({\n      pos: p.pos, n: String(p.n),\n      proj: p.meanProj.toFixed(1), actual: p.meanActual.toFixed(1),\n      bias: (p.bias >= 0 ? '+' : '') + p.bias.toFixed(1),\n      biasStyle: `font-weight:700;font-variant-numeric:tabular-nums;color:${Math.abs(p.bias) < 1.5 ? OK : Math.abs(p.bias) < 3.5 ? '#a5590a' : RED}`,\n      mae: p.mae.toFixed(1),\n      corrected: acc.bias[p.pos] ? '\\u00d7' + acc.bias[p.pos].toFixed(2) + ' applied' : (p.n >= 20 ? 'no correction needed' : 'needs ' + (20 - p.n) + ' more')\n    }));\n    v.accIntro = 'Every projection this app shows is written down with the player\\u2019s season totals at that moment. '\n      + 'Once he plays again, the difference in those totals is what he actually scored, so the projection grades itself '\n      + 'with no extra data. Once a position has 20 graded projections, its measured bias is applied to future ones.';\n    v.accEmpty = 'Nothing graded yet. ' + (acc.open ? acc.open + ' projections are logged and waiting for those games to be played.' : 'Open the Fantasy tab during a week with games to start the log.')\n      + ' Until this table has numbers in it, treat the projections as untested.';\n    v.accClear = () => { if (this.U) { this.U.clearFpLog(); this.forceUpdate(); } };\n\n    // Log this week's projections so they can be graded later. Same player and\n    // week logs once, no matter how often the tab is opened.\n    if (useLive && this.U && s.usage) {\n      const stamp = s.season + '|' + s.week + '|' + scoring;\n      if (this._fpLogged !== stamp) {\n        this._fpLogged = stamp;\n        try {\n          this.U.logProjections({\n            usage: s.usage, scoring, season: s.season, week: s.week,\n            rows: liveBase.filter(r => r.proj >= 4 && r.id)\n          });\n        } catch (e) {}\n      }\n    }\n\n    const as_ = this.fpAdjStats || {};\n    v.fpAdjNote = useLive\n      ? 'Injuries are handled inside the projection rather than after it: anyone ruled out keeps none of his usage share, '\n        + 'doubtful keeps a quarter and questionable keeps most of it, and the share that comes free is redistributed to '\n        + 'the players still playing in proportion to the role they already had. No fixed fraction, no guessed backup.'\n      : !s.inj\n      ? 'ESPN\\u2019s injury report did not answer, so these projections are exactly as the snapshot generated them \\u2014 anyone ruled out since then is still projected as if playing.'\n      : (as_.ruled || as_.downgraded || as_.promoted)\n        ? 'Re-priced against today\\u2019s injury report: ' + (as_.ruled || 0) + ' ruled out and projected zero, '\n          + (as_.downgraded || 0) + ' cut back for a doubtful or questionable tag, and '\n          + (as_.promoted || 0) + ' given a share of the vacated work. Only part of an absent player\\u2019s points transfers \\u2014 the rest was his own efficiency, which a backup does not inherit.'\n        : 'Checked against today\\u2019s injury report; nobody on this slate carries a designation that moves a projection.';\n    v.fpBaseNote = useLive\n      ? 'The snapshot file is no longer in this calculation. It still supplies EPA and the reference tables, but every '\n        + 'number above is derived from feeds that answered today.'\n      : 'Projection baseline generated ' + new Date(s.snap.generated).toLocaleDateString()\n      + '. Volume, floor, ceiling and the injury correction are computed fresh each time this opens; the baseline itself is only as current as that date.';\n\n    const sortKey = { 'Player': 'player', 'Pos': 'pos', 'Team': 'team', 'Opponent': 'opp',\n      'Projected': 'proj', 'Floor': 'floor', 'Ceiling': 'ceiling', 'Boom': 'boomPct',\n      'Bust': 'bustPct', 'L3 Avg': 'l3', 'Trend': 'trend', 'Snap%': 'snap', 'Target Share%': 'tgt' }[s.fpSort] || 'proj';\n    rows.sort((a, b) => {\n      const av = a[sortKey], bv = b[sortKey];\n      const an = parseFloat(av), bn = parseFloat(bv);\n      if (!isNaN(an) && !isNaN(bn)) return (an - bn) * s.fpDir;\n      return String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv)) * s.fpDir;\n    });\n\n    v.fpQuery = s.fpQuery || '';\n    v.onFpQuery = e => set({ fpQuery: e.target.value });\n    v.positions = ['ALL', 'QB', 'RB', 'WR', 'TE', 'FLEX', 'K', 'DEF'].map(p => this.pill(s.pos === p, p, () => set({ pos: p }), '6px 10px'));\n    const allTeams = Object.keys(s.teams).sort();\n    v.teamOptions = [{ v: 'ALL', label: 'All teams' }].concat(allTeams.map(t => ({ v: t, label: t })));\n    v.teamFilter = s.team;\n    v.onTeam = e => set({ team: e.target.value });\n    v.minPts = s.minPts; v.minPtsLabel = s.minPts === 0 ? 'any' : s.minPts + '+';\n    v.onMinPts = e => set({ minPts: parseInt(e.target.value, 10) });\n    v.togg
